<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Overhead Bin: Boarding Rush</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f1620;
  color: #e8edf4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

#hud {
  display: flex;
  gap: 10px;
  background: #17212e;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid #26344a;
  width: 100%;
  max-width: 420px;
  justify-content: space-between;
}

#hud .stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 44px;
}

#hud .label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  white-space: nowrap;
}

#hud span:not(.label) {
  font-size: 17px;
  font-weight: 700;
}

#progressWrap {
  width: 100%;
  max-width: 420px;
}

#progressLabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8fa2bd;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}

#progressBar {
  width: 100%;
  height: 8px;
  background: #1c2733;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #26344a;
}

#progressFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4caf7d, #ffb74d, #ff6b6b);
}

#canvasWrap {
  width: 100%;
  max-width: 420px;
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid #26344a;
  background: #0d141d;
}

canvas { display: block; margin: 0 auto; touch-action: manipulation; }

#bagPanel {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
  padding: 10px 14px;
}

#bagPreview {
  height: 32px;
  width: 40px;
  border-radius: 6px;
  background: #3a4a63;
  flex-shrink: 0;
  transition: background 0.15s;
}

#bagInfo { flex: 1; min-width: 0; }

#bagLabel {
  font-size: 13px;
  color: #e8edf4;
  font-weight: 600;
}

#bagSub {
  font-size: 11px;
  color: #8fa2bd;
  margin-top: 2px;
}

#bagSub.warn { color: #ff8fb0; font-weight: 600; }

#gateCheckBtn {
  background: #3a2733;
  color: #ffb4c6;
  border: 1px solid #5c3444;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

#gateCheckBtn.pulse {
  background: #ff6b95;
  color: #2a0d18;
  border-color: #ff6b95;
}

#gateCheckBtn:disabled { opacity: 0.35; cursor: default; }

#queueArea {
  width: 100%;
  max-width: 420px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
  padding: 8px 14px;
}

#queueArea .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  margin-bottom: 5px;
}

#queueRow {
  display: flex;
  gap: 6px;
  min-height: 26px;
  overflow-x: auto;
}

.queueBag {
  height: 22px;
  border-radius: 4px;
  background: #3a4a63;
  align-self: center;
  flex-shrink: 0;
}

#toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #1c2733;
  border: 1px solid #2f3f56;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 5;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 15, 0.88);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#overlay.hidden { display: none; }

#overlayCard {
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 14px;
  padding: 28px 32px;
  text-align: center;
  max-width: 380px;
}

#overlayCard h1 { margin-top: 0; font-size: 22px; }
#overlayCard p { font-size: 14px; line-height: 1.6; color: #c3d0e2; }

#restartBtn {
  margin-top: 10px;
  background: #2f6fed;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
}

#restartBtn:hover { background: #4a83f5; }
</style>
</head>
<body>
  <div id="hud">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat"><span class="label">Stowed</span><span id="stowedCount">0</span></div>
    <div class="stat"><span class="label">Closed</span><span id="closedCount">0</span></div>
    <div class="stat"><span class="label">Pink Tag</span><span id="oversizedCount">0</span></div>
  </div>

  <div id="progressWrap">
    <div id="progressLabel"><span>Nose</span><span>Boarding front</span><span>Tail</span></div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="canvasWrap">
    <canvas id="cabin" width="380" height="524"></canvas>
  </div>

  <div id="bagPanel">
    <div id="bagPreview"></div>
    <div id="bagInfo">
      <div id="bagLabel">Waiting for boarding...</div>
      <div id="bagSub">Tap an open bin ahead of the line to stow it.</div>
    </div>
    <button id="gateCheckBtn">Pink tag<br>(gate-check)</button>
  </div>

  <div id="queueArea">
    <div class="label">Next in the aisle</div>
    <div id="queueRow"></div>
  </div>

  <div id="toast"></div>

  <div id="overlay" class="hidden">
    <div id="overlayCard">
      <h1 id="overlayTitle"></h1>
      <p id="overlayBody"></p>
      <button id="restartBtn">Board Next Flight</button>
    </div>
  </div>

  <script>
// Overhead Bin: Boarding Rush
// A vertical two-sided bin-packing game. Passengers stream down the aisle
// from the nose to the tail; a boarding "front" sweeps down with them.
// Once the front passes a row, whatever's still empty in that row's bins
// is gone for good — you can't reach back up the aisle. Occasional bags
// are secretly oversized and only reveal it when you try to stow them.
// Filling a bin scores; deliberately closing a full bin scores more.

const ROWS = 8;
const CAPACITY_CHOICES = [3, 4, 5, 6];
const BAG_COLORS = ["#ff8a65", "#ffd54f", "#4fc3f7", "#81c784", "#ba68c8", "#f06292"];
const OVERSIZED_CHANCE = 0.16;
const QUEUE_LENGTH = 60;

const TOP_MARGIN = 34;
const BOTTOM_MARGIN = 34;
const ROW_HEIGHT = 58;
const CELL = 22;
const CELL_GAP = 3;
const AISLE_WIDTH = 64;
const SIDE_PAD = 8;

const CANVAS_W = SIDE_PAD * 2 + AISLE_WIDTH + 2 * (6 * (CELL + CELL_GAP) - CELL_GAP);
const CANVAS_H = TOP_MARGIN + ROWS * ROW_HEIGHT + BOTTOM_MARGIN;

const SCORE = {
  placeBase: 6,
  placePerSize: 4,
  closeBonus: 20,
  oversizedHandled: 4,
  manualSkipPenalty: -3,
};

const canvas = document.getElementById("cabin");
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const stowedEl = document.getElementById("stowedCount");
const closedEl = document.getElementById("closedCount");
const oversizedEl = document.getElementById("oversizedCount");
const progressFillEl = document.getElementById("progressFill");
const bagPreviewEl = document.getElementById("bagPreview");
const bagLabelEl = document.getElementById("bagLabel");
const bagSubEl = document.getElementById("bagSub");
const gateCheckBtn = document.getElementById("gateCheckBtn");
const queueRowEl = document.getElementById("queueRow");
const toastEl = document.getElementById("toast");
const overlayEl = document.getElementById("overlay");
const overlayTitleEl = document.getElementById("overlayTitle");
const overlayBodyEl = document.getElementById("overlayBody");
const restartBtn = document.getElementById("restartBtn");

let state;
let toastTimer = null;

function aisleLeft() { return CANVAS_W / 2 - AISLE_WIDTH / 2; }
function aisleRight() { return CANVAS_W / 2 + AISLE_WIDTH / 2; }
function rowTop(i) { return TOP_MARGIN + i * ROW_HEIGHT; }

function makeBin() {
  const capacity = CAPACITY_CHOICES[Math.floor(Math.random() * CAPACITY_CHOICES.length)];
  return {
    capacity,
    cells: new Array(capacity).fill(null),
    locked: false,
    closed: false,
    flashUntil: 0,
    flashColor: null,
  };
}

function makeRows() {
  const rows = [];
  for (let i = 0; i < ROWS; i++) {
    rows.push({ left: makeBin(), right: makeBin(), locked: false });
  }
  return rows;
}

function makeBag(index) {
  const difficulty = Math.min(1, index / (QUEUE_LENGTH * 0.7));
  const size = 1 + Math.floor(Math.random() * (difficulty > 0.4 ? 3 : 2.5));
  return {
    size: Math.min(size, 3),
    color: BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)],
    oversized: Math.random() < OVERSIZED_CHANCE,
    revealed: false,
  };
}

function newGame() {
  const queue = [];
  for (let i = 0; i < QUEUE_LENGTH; i++) queue.push(makeBag(i));

  state = {
    rows: makeRows(),
    queue,
    current: null,
    sweepY: 0,
    score: 0,
    stowed: 0,
    closed: 0,
    oversizedHandled: 0,
    lastTick: performance.now(),
    over: false,
    walkers: [0.1, 0.35, 0.62, 0.85].map((phase) => ({ phase })),
  };

  pullNextBag();
  overlayEl.classList.add("hidden");
  requestAnimationFrame(loop);
}

function pullNextBag() {
  state.current = state.queue.length ? state.queue.shift() : null;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

function contiguousFreeRun(bin, len) {
  let runStart = -1;
  let runLen = 0;
  for (let i = 0; i < bin.cells.length; i++) {
    if (bin.cells[i] === null) {
      if (runLen === 0) runStart = i;
      runLen++;
      if (runLen >= len) return runStart;
    } else {
      runLen = 0;
    }
  }
  return -1;
}

function isFull(bin) {
  return bin.cells.every((c) => c !== null);
}

function handleBinTap(rowIndex, side) {
  if (state.over) return;
  const row = state.rows[rowIndex];
  const bin = side === "left" ? row.left : row.right;

  if (bin.closed) return;

  if (isFull(bin)) {
    bin.closed = true;
    state.closed += 1;
    state.score += SCORE.closeBonus;
    bin.flashUntil = performance.now() + 350;
    bin.flashColor = "#ffd54f";
    showToast(`Bin closed! +${SCORE.closeBonus}`);
    return;
  }

  if (!state.current) return;

  if (bin.locked) {
    bin.flashUntil = performance.now() + 250;
    bin.flashColor = "#ff6b6b";
    showToast("Too late — the line already passed this row");
    return;
  }

  if (state.current.oversized) {
    state.current.revealed = true;
    bin.flashUntil = performance.now() + 300;
    bin.flashColor = "#ff6ba8";
    showToast("Doesn't fit! It's oversized — needs a pink tag");
    return;
  }

  const start = contiguousFreeRun(bin, state.current.size);
  if (start === -1) {
    bin.flashUntil = performance.now() + 250;
    bin.flashColor = "#ff6b6b";
    showToast("No room in that bin");
    return;
  }

  for (let i = start; i < start + state.current.size; i++) bin.cells[i] = state.current.color;
  state.score += SCORE.placeBase + SCORE.placePerSize * state.current.size;
  state.stowed += 1;
  bin.flashUntil = performance.now() + 250;
  bin.flashColor = "#4caf7d";
  pullNextBag();
}

function gateCheck() {
  if (!state.current || state.over) return;
  if (state.current.oversized) {
    state.oversizedHandled += 1;
    state.score += SCORE.oversizedHandled;
    showToast("Pink-tagged and gate-checked");
  } else {
    state.score += SCORE.manualSkipPenalty;
    showToast("Gate-checked");
  }
  pullNextBag();
}

function tick(dt) {
  const progress = state.sweepY / (CANVAS_H - BOTTOM_MARGIN);
  const speedMultiplier = 1 + 1.6 * progress;
  const baseSpeed = (CANVAS_H - TOP_MARGIN - BOTTOM_MARGIN) / 62;
  state.sweepY += baseSpeed * speedMultiplier * dt;

  state.rows.forEach((row, i) => {
    if (row.locked) return;
    const bottom = rowTop(i) + ROW_HEIGHT - 10;
    if (state.sweepY > bottom) {
      row.locked = true;
      row.left.locked = true;
      row.right.locked = true;
    }
  });

  if (state.sweepY >= CANVAS_H - BOTTOM_MARGIN && !state.over) {
    endGame();
  }
}

function endGame() {
  state.over = true;
  overlayEl.classList.remove("hidden");
  let wastedCells = 0;
  let totalCells = 0;
  state.rows.forEach((row) => {
    [row.left, row.right].forEach((bin) => {
      totalCells += bin.capacity;
      wastedCells += bin.cells.filter((c) => c === null).length;
    });
  });
  const efficiency = Math.round(((totalCells - wastedCells) / totalCells) * 100);
  overlayTitleEl.textContent = "Doors closing!";
  overlayBodyEl.textContent =
    `Stowed ${state.stowed} bags, closed ${state.closed} bins, pink-tagged ${state.oversizedHandled} oversized ` +
    `bags. Cabin was ${efficiency}% packed. Final score: ${state.score}.`;
}

function binRect(rowIndex, side) {
  const row = state.rows[rowIndex];
  const bin = side === "left" ? row.left : row.right;
  const width = bin.capacity * (CELL + CELL_GAP) - CELL_GAP;
  const y = rowTop(rowIndex) + 14;
  let x;
  if (side === "left") x = aisleLeft() - width;
  else x = aisleRight();
  return { x, y, width, height: CELL, bin };
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // fuselage background
  ctx.fillStyle = "#111a25";
  roundRect(ctx, 0, 0, CANVAS_W, CANVAS_H, 18);
  ctx.fill();

  // aisle strip
  ctx.fillStyle = "#0a1119";
  ctx.fillRect(aisleLeft(), 0, AISLE_WIDTH, CANVAS_H);
  ctx.strokeStyle = "#243348";
  ctx.setLineDash([6, 8]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CANVAS_W / 2, 4);
  ctx.lineTo(CANVAS_W / 2, CANVAS_H - 4);
  ctx.stroke();
  ctx.setLineDash([]);

  // rows: bins + seat hint
  state.rows.forEach((row, i) => {
    ["left", "right"].forEach((side) => {
      const { x, y, width, height, bin } = binRect(i, side);
      const now = performance.now();
      const flashing = now < bin.flashUntil;

      let fillStyle = "#1c2733";
      let strokeStyle = "#2f3f56";
      if (bin.closed) {
        strokeStyle = "#ffd54f";
      } else if (bin.locked && !isFull(bin)) {
        fillStyle = "#161f29";
        strokeStyle = "#2a2f3a";
      }
      if (flashing) {
        strokeStyle = bin.flashColor;
        fillStyle = bin.flashColor + "22";
      }

      ctx.fillStyle = fillStyle;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = bin.closed ? 3 : 2;
      roundRect(ctx, x - 6, y - 8, width + 12, height + 16, 8);
      ctx.fill();
      ctx.stroke();

      bin.cells.forEach((cell, ci) => {
        const cx = x + ci * (CELL + CELL_GAP);
        if (cell) {
          ctx.fillStyle = cell;
          roundRect(ctx, cx, y, CELL, CELL, 4);
          ctx.fill();
        } else if (bin.locked) {
          ctx.fillStyle = "#20242f";
          roundRect(ctx, cx, y, CELL, CELL, 4);
          ctx.fill();
          ctx.strokeStyle = "#3a3040";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx + 3, y + CELL - 3);
          ctx.lineTo(cx + CELL - 3, y + 3);
          ctx.stroke();
        } else {
          ctx.fillStyle = "#2a3646";
          roundRect(ctx, cx, y, CELL, CELL, 4);
          ctx.fill();
        }
      });

      if (bin.closed) {
        ctx.fillStyle = "#ffd54f";
        ctx.font = "11px sans-serif";
        const lockX = side === "left" ? x - 4 : x + width - 6;
        ctx.fillText("\u{1F512}", lockX, y - 10);
      }
    });
  });

  // walking passengers in the aisle (decorative)
  const now = performance.now();
  state.walkers.forEach((w) => {
    const t = ((now / 1400 + w.phase) % 1);
    const y = t * Math.max(state.sweepY, 20);
    const bob = Math.sin(now / 180 + w.phase * 10) * 2;
    ctx.fillStyle = "#5b7ba8";
    ctx.beginPath();
    ctx.ellipse(CANVAS_W / 2 + bob, y + 6, 6, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // boarding front sweep line
  const sy = Math.min(state.sweepY, CANVAS_H - BOTTOM_MARGIN);
  const grad = ctx.createLinearGradient(0, sy - 10, 0, sy + 4);
  grad.addColorStop(0, "rgba(79,195,247,0)");
  grad.addColorStop(1, "rgba(79,195,247,0.35)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, sy - 10, CANVAS_W, 14);
  ctx.strokeStyle = "#4fc3f7";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(4, sy);
  ctx.lineTo(CANVAS_W - 4, sy);
  ctx.stroke();
}

function updateHUD() {
  scoreEl.textContent = state.score;
  stowedEl.textContent = state.stowed;
  closedEl.textContent = state.closed;
  oversizedEl.textContent = state.oversizedHandled;

  const pct = Math.min(100, (state.sweepY / (CANVAS_H - BOTTOM_MARGIN)) * 100);
  progressFillEl.style.width = `${pct}%`;

  if (state.current) {
    bagPreviewEl.style.width = `${24 + state.current.size * 16}px`;
    bagPreviewEl.style.background = state.current.color;
    if (state.current.revealed) {
      bagLabelEl.textContent = "Oversized bag — won't fit anywhere";
      bagSubEl.textContent = "Tap the pink tag button to gate-check it.";
      bagSubEl.classList.add("warn");
      gateCheckBtn.classList.add("pulse");
    } else {
      bagLabelEl.textContent = `Bag size ${state.current.size}`;
      bagSubEl.textContent = "Tap an open bin ahead of the boarding line.";
      bagSubEl.classList.remove("warn");
      gateCheckBtn.classList.remove("pulse");
    }
    gateCheckBtn.disabled = false;
  } else {
    bagPreviewEl.style.background = "#3a4a63";
    bagLabelEl.textContent = state.over ? "" : "No more bags";
    bagSubEl.textContent = "";
    bagSubEl.classList.remove("warn");
    gateCheckBtn.disabled = true;
    gateCheckBtn.classList.remove("pulse");
  }

  queueRowEl.innerHTML = "";
  state.queue.slice(0, 14).forEach((b) => {
    const el = document.createElement("div");
    el.className = "queueBag";
    el.style.width = `${14 + b.size * 14}px`;
    el.style.background = b.color;
    queueRowEl.appendChild(el);
  });
}

function loop(now) {
  if (!state.over) {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    tick(Math.min(dt, 0.1));
  }
  draw();
  updateHUD();
  if (!state.over) requestAnimationFrame(loop);
  else {
    draw();
    updateHUD();
  }
}

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  for (let i = 0; i < ROWS; i++) {
    const top = rowTop(i);
    if (y < top || y > top + ROW_HEIGHT) continue;
    ["left", "right"].forEach((side) => {
      const { x: bx, width } = binRect(i, side);
      if (x >= bx - 6 && x <= bx + width + 6) {
        handleBinTap(i, side);
      }
    });
  }
});

gateCheckBtn.addEventListener("click", gateCheck);
restartBtn.addEventListener("click", newGame);

newGame();
  </script>
</body>
</html>
