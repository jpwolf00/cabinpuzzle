<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Overhead Bin: Boarding Rush</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f1620;
  color: #e8edf4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

#hud {
  display: flex;
  gap: 10px;
  background: #17212e;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid #26344a;
  width: 100%;
  max-width: 420px;
  justify-content: space-between;
}

#hud .stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 44px;
}

#hud .label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  white-space: nowrap;
}

#hud span:not(.label) {
  font-size: 17px;
  font-weight: 700;
}

#progressWrap { width: 100%; max-width: 420px; }

#progressLabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8fa2bd;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}

#progressBar {
  width: 100%;
  height: 8px;
  background: #1c2733;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #26344a;
}

#progressFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4caf7d, #ffb74d, #ff6b6b);
}

#canvasWrap {
  width: 100%;
  max-width: 420px;
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid #26344a;
  background: #0d141d;
}

canvas { display: block; margin: 0 auto; touch-action: manipulation; }

#bagPanel {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
  padding: 10px 14px;
}

#bagPreview {
  width: 34px;
  border-radius: 5px;
  background: #3a4a63;
  flex-shrink: 0;
  height: 26px;
  transition: background 0.15s, height 0.15s;
}

#bagInfo { flex: 1; min-width: 0; }

#bagLabel { font-size: 13px; color: #e8edf4; font-weight: 600; }

#bagSub { font-size: 11px; color: #8fa2bd; margin-top: 2px; }

#bagSub.warn { color: #ff8fb0; font-weight: 600; }

#gateCheckBtn {
  background: #3a2733;
  color: #ffb4c6;
  border: 1px solid #5c3444;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

#gateCheckBtn.pulse {
  background: #ff6b95;
  color: #2a0d18;
  border-color: #ff6b95;
}

#gateCheckBtn:disabled { opacity: 0.35; cursor: default; }

#queueArea {
  width: 100%;
  max-width: 420px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
  padding: 8px 14px;
}

#queueArea .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  margin-bottom: 5px;
}

#queueRow {
  display: flex;
  gap: 6px;
  min-height: 26px;
  overflow-x: auto;
  align-items: flex-end;
}

.queueBag {
  width: 18px;
  border-radius: 3px;
  background: #3a4a63;
  flex-shrink: 0;
}

#toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #1c2733;
  border: 1px solid #2f3f56;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 5;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 15, 0.88);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#overlay.hidden { display: none; }

#overlayCard {
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 14px;
  padding: 28px 32px;
  text-align: center;
  max-width: 380px;
}

#overlayCard h1 { margin-top: 0; font-size: 22px; }
#overlayCard p { font-size: 14px; line-height: 1.6; color: #c3d0e2; }

#restartBtn {
  margin-top: 10px;
  background: #2f6fed;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
}

#restartBtn:hover { background: #4a83f5; }
</style>
</head>
<body>
  <div id="hud">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat"><span class="label">Stowed</span><span id="stowedCount">0</span></div>
    <div class="stat"><span class="label">Closed</span><span id="closedCount">0</span></div>
    <div class="stat"><span class="label">Pink Tag</span><span id="oversizedCount">0</span></div>
  </div>

  <div id="progressWrap">
    <div id="progressLabel"><span>Nose</span><span>Boarding front</span><span>Tail</span></div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="canvasWrap">
    <canvas id="cabin"></canvas>
  </div>

  <div id="bagPanel">
    <div id="bagPreview"></div>
    <div id="bagInfo">
      <div id="bagLabel">Waiting for boarding...</div>
      <div id="bagSub">Tap bin space ahead of the boarding line.</div>
    </div>
    <button id="gateCheckBtn">Pink tag<br>(gate-check)</button>
  </div>

  <div id="queueArea">
    <div class="label">Next in the aisle</div>
    <div id="queueRow"></div>
  </div>

  <div id="toast"></div>

  <div id="overlay" class="hidden">
    <div id="overlayCard">
      <h1 id="overlayTitle"></h1>
      <p id="overlayBody"></p>
      <button id="restartBtn">Board Next Flight</button>
    </div>
  </div>

  <script>
// Overhead Bin: Boarding Rush
//
// Top-down cabin. Overhead bins run lengthwise along the fuselage — a
// continuous run of bins down each side of the aisle, their sections
// stacked nose-to-tail the way real bins are. Passengers stream aft and a
// boarding "front" sweeps down with them; any bin section the front has
// already passed is out of reach for good, so empty space left up front is
// wasted. Some bags are secretly oversized and only reveal it when you try
// to stow them — those need a pink tag. Fill a bin and latch it shut
// before the line passes it for a bonus.

const CELL_H = 22;          // one bin section, measured along the fuselage
const CELL_GAP = 3;
const BIN_PAD = 5;
const BIN_GAP = 11;         // gap between adjacent bins along the length
const BIN_W = 100;          // bin depth, across the fuselage
const SEAT_STRIP = 26;
const AISLE_W = 60;
const SIDE_PAD = 18;
const TOP_MARGIN = 34;
const BOTTOM_MARGIN = 34;

const CAPACITY_CHOICES = [3, 4, 5, 6];
const BAG_COLORS = ["#ff8a65", "#ffd54f", "#4fc3f7", "#81c784", "#ba68c8", "#f06292"];
const OVERSIZED_CHANCE = 0.16;
const QUEUE_LENGTH = 70;
const SWEEP_SECONDS = 70;   // nose-to-tail at base speed, before ramp

const CANVAS_W = SIDE_PAD * 2 + BIN_W * 2 + SEAT_STRIP * 2 + AISLE_W;
const CANVAS_H = 560;
const CABIN_TOP = TOP_MARGIN;
const CABIN_BOTTOM = CANVAS_H - BOTTOM_MARGIN;

const SCORE = {
  placeBase: 6,
  placePerSize: 4,
  closeBase: 8,
  closePerCapacity: 4,
  oversizedHandled: 4,
  wrongGateCheck: -3,
};

const canvas = document.getElementById("cabin");
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const stowedEl = document.getElementById("stowedCount");
const closedEl = document.getElementById("closedCount");
const oversizedEl = document.getElementById("oversizedCount");
const progressFillEl = document.getElementById("progressFill");
const bagPreviewEl = document.getElementById("bagPreview");
const bagLabelEl = document.getElementById("bagLabel");
const bagSubEl = document.getElementById("bagSub");
const gateCheckBtn = document.getElementById("gateCheckBtn");
const queueRowEl = document.getElementById("queueRow");
const toastEl = document.getElementById("toast");
const overlayEl = document.getElementById("overlay");
const overlayTitleEl = document.getElementById("overlayTitle");
const overlayBodyEl = document.getElementById("overlayBody");
const restartBtn = document.getElementById("restartBtn");

let state;
let toastTimer = null;

function binX(side) {
  return side === "left" ? SIDE_PAD : CANVAS_W - SIDE_PAD - BIN_W;
}

function binHeightFor(capacity) {
  return BIN_PAD * 2 + capacity * (CELL_H + CELL_GAP) - CELL_GAP;
}

function cellY(bin, i) {
  return bin.y + BIN_PAD + i * (CELL_H + CELL_GAP);
}

// A section is out of reach once the boarding front has moved past its
// aft edge — the crowd has pushed by and nobody can get back to it.
function cellLocked(bin, i) {
  return state.sweepY > cellY(bin, i) + CELL_H;
}

function binFullyPassed(bin) {
  return state.sweepY > bin.y + bin.height;
}

function isFull(bin) {
  return bin.cells.every((c) => c !== null);
}

// Lay a run of bins down one side, nose to tail, until the cabin runs out.
function makeBinRun(side) {
  const bins = [];
  let y = CABIN_TOP;
  const minHeight = binHeightFor(Math.min(...CAPACITY_CHOICES));
  while (y + minHeight <= CABIN_BOTTOM) {
    const fits = CAPACITY_CHOICES.filter((c) => y + binHeightFor(c) <= CABIN_BOTTOM);
    const capacity = fits[Math.floor(Math.random() * fits.length)];
    const height = binHeightFor(capacity);
    bins.push({
      side,
      capacity,
      cells: new Array(capacity).fill(null),
      y,
      height,
      closed: false,
      flashUntil: 0,
      flashColor: null,
    });
    y += height + BIN_GAP;
  }
  return bins;
}

function makeBag(index) {
  const difficulty = Math.min(1, index / (QUEUE_LENGTH * 0.7));
  const size = 1 + Math.floor(Math.random() * (difficulty > 0.4 ? 3 : 2.5));
  return {
    size: Math.min(size, 3),
    color: BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)],
    oversized: Math.random() < OVERSIZED_CHANCE,
    revealed: false,
  };
}

function newGame() {
  const queue = [];
  for (let i = 0; i < QUEUE_LENGTH; i++) queue.push(makeBag(i));

  state = {
    bins: [...makeBinRun("left"), ...makeBinRun("right")],
    queue,
    current: null,
    sweepY: CABIN_TOP,
    score: 0,
    stowed: 0,
    closed: 0,
    oversizedHandled: 0,
    lastTick: performance.now(),
    over: false,
    walkers: [0.05, 0.3, 0.55, 0.78].map((phase) => ({ phase })),
  };

  pullNextBag();
  overlayEl.classList.add("hidden");
  requestAnimationFrame(loop);
}

function pullNextBag() {
  state.current = state.queue.length ? state.queue.shift() : null;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

// First run of `len` adjacent sections that are both empty and still reachable.
function contiguousFreeRun(bin, len) {
  let runStart = -1;
  let runLen = 0;
  for (let i = 0; i < bin.cells.length; i++) {
    if (bin.cells[i] === null && !cellLocked(bin, i)) {
      if (runLen === 0) runStart = i;
      runLen++;
      if (runLen >= len) return runStart;
    } else {
      runLen = 0;
    }
  }
  return -1;
}

function flash(bin, color, ms) {
  bin.flashUntil = performance.now() + ms;
  bin.flashColor = color;
}

function handleBinTap(bin) {
  if (state.over || bin.closed) return;

  // Tapping a full bin latches it shut, as long as you can still reach it.
  if (isFull(bin)) {
    if (binFullyPassed(bin)) {
      flash(bin, "#ff6b6b", 250);
      showToast("The line already pushed past that bin");
      return;
    }
    const bonus = SCORE.closeBase + SCORE.closePerCapacity * bin.capacity;
    bin.closed = true;
    state.closed += 1;
    state.score += bonus;
    flash(bin, "#ffd54f", 350);
    showToast(`Bin latched! +${bonus}`);
    return;
  }

  if (!state.current) return;

  if (binFullyPassed(bin)) {
    flash(bin, "#ff6b6b", 250);
    showToast("The line already pushed past that bin");
    return;
  }

  if (state.current.oversized) {
    state.current.revealed = true;
    flash(bin, "#ff6ba8", 300);
    showToast("Doesn't fit! It's oversized — needs a pink tag");
    return;
  }

  const start = contiguousFreeRun(bin, state.current.size);
  if (start === -1) {
    flash(bin, "#ff6b6b", 250);
    showToast("No reachable space in that bin");
    return;
  }

  for (let i = start; i < start + state.current.size; i++) {
    bin.cells[i] = state.current.color;
  }
  state.score += SCORE.placeBase + SCORE.placePerSize * state.current.size;
  state.stowed += 1;
  flash(bin, "#4caf7d", 250);
  pullNextBag();
}

function gateCheck() {
  if (!state.current || state.over) return;
  if (state.current.oversized) {
    state.oversizedHandled += 1;
    state.score += SCORE.oversizedHandled;
    showToast("Pink-tagged and gate-checked");
  } else {
    state.score += SCORE.wrongGateCheck;
    showToast("Gate-checked a bag that would have fit");
  }
  pullNextBag();
}

function tick(dt) {
  const span = CABIN_BOTTOM - CABIN_TOP;
  const progress = (state.sweepY - CABIN_TOP) / span;
  const speed = (span / SWEEP_SECONDS) * (1 + 1.5 * progress);
  state.sweepY += speed * dt;

  if (state.sweepY >= CABIN_BOTTOM && !state.over) endGame();
}

function endGame() {
  state.over = true;
  overlayEl.classList.remove("hidden");
  let filled = 0;
  let total = 0;
  state.bins.forEach((bin) => {
    total += bin.capacity;
    filled += bin.cells.filter((c) => c !== null).length;
  });
  const efficiency = Math.round((filled / total) * 100);
  overlayTitleEl.textContent = "Doors closing!";
  overlayBodyEl.textContent =
    `Stowed ${state.stowed} bags, latched ${state.closed} bins, pink-tagged ` +
    `${state.oversizedHandled} oversized bags. The cabin ended ${efficiency}% packed. ` +
    `Final score: ${state.score}.`;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawFuselage() {
  ctx.fillStyle = "#111a25";
  roundRect(ctx, 4, 6, CANVAS_W - 8, CANVAS_H - 12, 46);
  ctx.fill();
  ctx.strokeStyle = "#243348";
  ctx.lineWidth = 2;
  ctx.stroke();

  // aisle
  const ax = CANVAS_W / 2 - AISLE_W / 2;
  ctx.fillStyle = "#0a1119";
  ctx.fillRect(ax, 10, AISLE_W, CANVAS_H - 20);
  ctx.strokeStyle = "#1e2b3d";
  ctx.setLineDash([5, 9]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CANVAS_W / 2, 14);
  ctx.lineTo(CANVAS_W / 2, CANVAS_H - 14);
  ctx.stroke();
  ctx.setLineDash([]);

  // seat rows between the bins and the aisle, for orientation
  ctx.fillStyle = "#18222f";
  for (let y = CABIN_TOP; y < CABIN_BOTTOM - 12; y += 30) {
    [SIDE_PAD + BIN_W + 4, CANVAS_W - SIDE_PAD - BIN_W - SEAT_STRIP + 4].forEach((sx) => {
      roundRect(ctx, sx, y, SEAT_STRIP - 8, 22, 4);
      ctx.fill();
    });
  }
}

function drawBin(bin) {
  const x = binX(bin.side);
  const now = performance.now();
  const flashing = now < bin.flashUntil;
  const passed = binFullyPassed(bin);

  let fillStyle = "#1c2733";
  let strokeStyle = "#2f3f56";
  if (bin.closed) strokeStyle = "#ffd54f";
  else if (passed) { fillStyle = "#161f29"; strokeStyle = "#2a2f3a"; }
  if (flashing) { strokeStyle = bin.flashColor; fillStyle = bin.flashColor + "22"; }

  ctx.fillStyle = fillStyle;
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = bin.closed ? 3 : 2;
  roundRect(ctx, x, bin.y, BIN_W, bin.height, 9);
  ctx.fill();
  ctx.stroke();

  const cellX = x + BIN_PAD;
  const cellW = BIN_W - BIN_PAD * 2;
  bin.cells.forEach((cell, i) => {
    const cy = cellY(bin, i);
    if (cell) {
      ctx.fillStyle = cell;
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
    } else if (cellLocked(bin, i)) {
      // unreachable empty space — wasted for the rest of the flight
      ctx.fillStyle = "#20242f";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
      ctx.strokeStyle = "#3a3040";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let hx = cellX + 4; hx < cellX + cellW; hx += 8) {
        ctx.moveTo(hx, cy + CELL_H - 2);
        ctx.lineTo(hx + CELL_H - 4, cy + 2);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2a3646";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
    }
  });

  if (bin.closed) {
    ctx.fillStyle = "#ffd54f";
    ctx.font = "12px sans-serif";
    ctx.fillText("\u{1F512}", x + BIN_W / 2 - 6, bin.y + bin.height - 1);
  }
}

function drawWalkers() {
  const now = performance.now();
  state.walkers.forEach((w) => {
    const t = (now / 2600 + w.phase) % 1;
    const y = CABIN_TOP + t * Math.max(state.sweepY - CABIN_TOP, 24);
    const bob = Math.sin(now / 190 + w.phase * 10) * 3;
    ctx.fillStyle = "#5b7ba8";
    ctx.beginPath();
    ctx.ellipse(CANVAS_W / 2 + bob, y, 7, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7f9dc9";
    ctx.beginPath();
    ctx.arc(CANVAS_W / 2 + bob, y - 3, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSweep() {
  const sy = Math.min(state.sweepY, CABIN_BOTTOM);
  const grad = ctx.createLinearGradient(0, sy - 26, 0, sy + 4);
  grad.addColorStop(0, "rgba(79,195,247,0)");
  grad.addColorStop(1, "rgba(79,195,247,0.28)");
  ctx.fillStyle = grad;
  ctx.fillRect(8, sy - 26, CANVAS_W - 16, 30);
  ctx.strokeStyle = "#4fc3f7";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, sy);
  ctx.lineTo(CANVAS_W - 10, sy);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  drawFuselage();
  state.bins.forEach(drawBin);
  drawWalkers();
  drawSweep();
}

function updateHUD() {
  scoreEl.textContent = state.score;
  stowedEl.textContent = state.stowed;
  closedEl.textContent = state.closed;
  oversizedEl.textContent = state.oversizedHandled;

  const pct = Math.min(100, ((state.sweepY - CABIN_TOP) / (CABIN_BOTTOM - CABIN_TOP)) * 100);
  progressFillEl.style.width = `${pct}%`;

  if (state.current) {
    bagPreviewEl.style.height = `${state.current.size * 14 + 8}px`;
    bagPreviewEl.style.background = state.current.color;
    if (state.current.revealed) {
      bagLabelEl.textContent = "Oversized bag — won't fit anywhere";
      bagSubEl.textContent = "Tap the pink tag button to gate-check it.";
      bagSubEl.classList.add("warn");
      gateCheckBtn.classList.add("pulse");
    } else {
      bagLabelEl.textContent = `Bag — ${state.current.size} section${state.current.size > 1 ? "s" : ""}`;
      bagSubEl.textContent = "Tap bin space ahead of the boarding line.";
      bagSubEl.classList.remove("warn");
      gateCheckBtn.classList.remove("pulse");
    }
    gateCheckBtn.disabled = false;
  } else {
    bagPreviewEl.style.background = "#3a4a63";
    bagLabelEl.textContent = state.over ? "" : "No more bags";
    bagSubEl.textContent = "";
    bagSubEl.classList.remove("warn");
    gateCheckBtn.disabled = true;
    gateCheckBtn.classList.remove("pulse");
  }

  queueRowEl.innerHTML = "";
  state.queue.slice(0, 14).forEach((b) => {
    const el = document.createElement("div");
    el.className = "queueBag";
    el.style.height = `${b.size * 8 + 6}px`;
    el.style.background = b.color;
    queueRowEl.appendChild(el);
  });
}

function loop(now) {
  if (!state.over) {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    tick(Math.min(dt, 0.1));
  }
  draw();
  updateHUD();
  if (!state.over) requestAnimationFrame(loop);
}

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  const y = (e.clientY - rect.top) * (CANVAS_H / rect.height);

  const hit = state.bins.find((bin) => {
    const bx = binX(bin.side);
    return x >= bx && x <= bx + BIN_W && y >= bin.y && y <= bin.y + bin.height;
  });
  if (hit) handleBinTap(hit);
});

gateCheckBtn.addEventListener("click", gateCheck);
restartBtn.addEventListener("click", newGame);

newGame();
  </script>
</body>
</html>
