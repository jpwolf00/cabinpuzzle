<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Overhead Bin: Boarding Rush</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f1620;
  color: #e8edf4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

.panel {
  width: 100%;
  max-width: 460px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
}

#tailStrip {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 14px;
}

#tailNum { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
#tailType { font-size: 11px; color: #8fa2bd; }
#tailLevel { margin-left: auto; font-size: 10px; color: #8fa2bd; text-transform: uppercase; letter-spacing: 0.05em; }

#hud {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  justify-content: space-between;
}

#hud .stat { display: flex; flex-direction: column; align-items: center; min-width: 44px; }

#hud .label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  white-space: nowrap;
}

#hud span:not(.label) { font-size: 17px; font-weight: 700; }

#progressWrap { width: 100%; max-width: 460px; }

#progressLabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8fa2bd;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}

#progressBar {
  width: 100%;
  height: 8px;
  background: #1c2733;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #26344a;
}

#progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #4caf7d, #ffb74d, #ff6b6b); }

#canvasWrap {
  width: 100%;
  max-width: 460px;
  border-radius: 14px;
  border: 1px solid #26344a;
  background: #0d141d;
  height: 520px;
  max-height: 58vh;
  overflow: hidden; /* camera-follow sets scrollTop; the player never scrolls */
}

canvas { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; }

#bagPanel { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }

#bagPreview {
  width: 34px;
  border-radius: 5px;
  background: #3a4a63;
  flex-shrink: 0;
  height: 26px;
  transition: background 0.15s, height 0.15s;
  position: relative;
  margin-top: 6px;
}

/* telescoping handle — makes the blocks read as luggage */
#bagPreview::before, .queueBag::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 8px;
  border: 2px solid rgba(200, 214, 232, 0.6);
  border-bottom: none;
  border-radius: 5px 5px 0 0;
}

#bagInfo { flex: 1; min-width: 0; }
#bagLabel { font-size: 13px; color: #e8edf4; font-weight: 600; }
#bagSub { font-size: 11px; color: #8fa2bd; margin-top: 2px; }
#bagSub.warn { color: #ff8fb0; font-weight: 600; }

#gateCheckBtn {
  background: #3a2733;
  color: #ffb4c6;
  border: 1px solid #5c3444;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

#gateCheckBtn.pulse { background: #ff6b95; color: #2a0d18; border-color: #ff6b95; }
#gateCheckBtn:disabled { opacity: 0.35; cursor: default; }

#queueArea { padding: 8px 14px; }

#queueArea .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  margin-bottom: 5px;
}

#queueRow { display: flex; gap: 8px; min-height: 26px; overflow-x: auto; align-items: flex-end; padding-top: 8px; }
.queueBag { width: 18px; border-radius: 3px; background: #3a4a63; flex-shrink: 0; position: relative; }

#toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #1c2733;
  border: 1px solid #2f3f56;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 5;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 15, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow-y: auto;
}

#overlay.hidden { display: none; }

#overlayCard {
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 14px;
  padding: 24px 26px;
  text-align: center;
  max-width: 400px;
  width: 100%;
}

#overlayTag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #4fc3f7;
}

#overlayCard h1 { margin: 6px 0 4px; font-size: 21px; }
#overlayCard p { font-size: 13.5px; line-height: 1.6; color: #c3d0e2; margin: 10px 0; }

#quirkList {
  list-style: none;
  padding: 0;
  margin: 12px 0;
  text-align: left;
  font-size: 12.5px;
  color: #c3d0e2;
}

#quirkList li {
  padding: 6px 10px;
  background: #1c2733;
  border-left: 3px solid #4fc3f7;
  border-radius: 4px;
  margin-bottom: 6px;
}

#speedRow {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin: 14px 0 10px;
}

.speedBtn {
  flex: 1;
  background: #1c2733;
  border: 1px solid #2f3f56;
  border-radius: 8px;
  padding: 8px 6px;
  color: #8fa2bd;
  font-size: 12px;
  cursor: pointer;
  line-height: 1.35;
}

.speedBtn .sname { display: block; font-weight: 600; color: #c3d0e2; }
.speedBtn.sel { border-color: #4fc3f7; background: #1d3546; }
.speedBtn.sel .sname { color: #4fc3f7; }

.btnRow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }

button.primary {
  background: #2f6fed;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
}

button.primary:hover { background: #4a83f5; }

button.ghost {
  background: transparent;
  color: #8fa2bd;
  border: 1px solid #2f3f56;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
}

button.ghost:hover { color: #e8edf4; border-color: #4a5f7f; }

#fleetList { margin: 14px 0 4px; display: flex; flex-direction: column; gap: 6px; }

.fleetBtn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1c2733;
  border: 1px solid #2f3f56;
  border-radius: 8px;
  padding: 9px 12px;
  cursor: pointer;
  color: #e8edf4;
  font-size: 13px;
  text-align: left;
  width: 100%;
}

.fleetBtn:hover:not(:disabled) { border-color: #4fc3f7; }
.fleetBtn:disabled { opacity: 0.4; cursor: default; }
.fleetBtn .fdiff { color: #4fc3f7; font-size: 11px; letter-spacing: 1px; }
.fleetBtn .fname { font-weight: 600; white-space: nowrap; }
.fleetBtn .fsub { font-size: 10.5px; color: #8fa2bd; margin-left: auto; text-align: right; line-height: 1.3; }
.fleetBtn.done { border-left: 3px solid #4caf7d; }

#goalPanel {
  width: 100%;
  max-width: 460px;
  text-align: center;
  font-size: 11.5px;
  color: #8fa2bd;
  min-height: 14px;
}

#goalPanel.ok { color: #7fd6a8; }

#pauseBtn { margin-left: auto; padding: 2px 10px; font-size: 11px; line-height: 1.5; }

#overlayStars {
  font-size: 24px;
  color: #ffd54f;
  letter-spacing: 8px;
  margin: 2px 0 4px;
  min-height: 30px;
}

.briefArt { width: 120px; height: 150px; margin: 4px auto 8px; display: block; }

.fstars { color: #ffd54f; font-size: 11px; letter-spacing: 1px; margin-left: 6px; }
.fstars .on { color: #ffd54f; }
.fstars .off { color: #33415a; }
</style>
</head>
<body>
  <div class="panel" id="tailStrip">
    <span id="tailNum">—</span>
    <span id="tailType"></span>
    <span id="tailLevel"></span>
    <button id="pauseBtn" class="ghost" title="Pause (Esc)">II</button>
  </div>

  <div class="panel" id="hud">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat"><span class="label">Stowed</span><span id="stowedCount">0</span></div>
    <div class="stat"><span class="label">Latched</span><span id="closedCount">0</span></div>
    <div class="stat"><span class="label">Pink Tag</span><span id="oversizedCount">0</span></div>
    <div class="stat"><span class="label">Packed</span><span id="packedPct">0%</span></div>
  </div>

  <div id="progressWrap">
    <div id="progressLabel"><span>Nose</span><span>Boarding front</span><span>Tail</span></div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="goalPanel"></div>

  <div id="canvasWrap"><canvas id="cabin"></canvas></div>

  <div class="panel" id="bagPanel">
    <div id="bagPreview"></div>
    <div id="bagInfo">
      <div id="bagLabel">Waiting for boarding...</div>
      <div id="bagSub">Tap bin space ahead of the boarding line.</div>
    </div>
    <button id="gateCheckBtn">Pink tag<br>(gate-check)</button>
  </div>

  <div class="panel" id="queueArea">
    <div class="label">Next in the aisle</div>
    <div id="queueRow"></div>
  </div>

  <div id="toast"></div>

  <div id="overlay">
    <div id="overlayCard">
      <div id="overlayTag"></div>
      <h1 id="overlayTitle"></h1>
      <div id="overlayStars"></div>
      <canvas id="briefArt" class="briefArt" width="240" height="300"></canvas>
      <p id="overlayBody"></p>
      <ul id="quirkList"></ul>
      <div id="speedRow"></div>
      <div id="fleetList"></div>
      <div class="btnRow" id="overlayButtons"></div>
    </div>
  </div>

  <script>
// ---------------------------------------------------------------------------
// Overhead Bin: Boarding Rush
//
// Top-down cabin. Overhead bins run lengthwise along the fuselage. Passengers
// stream aft and a boarding "front" sweeps down with them; any bin section the
// front has passed is out of reach for good, so empty space left forward is
// wasted. Some bags are secretly oversized and only reveal it when you try to
// stow them — those need a pink tag. Fill a bin and latch it shut before the
// line passes for a bonus.
//
// Cabins are data-driven: an aircraft spec lists columns across the fuselage
// (bin runs, seat blocks, aisles), so a cramped regional jet and a twin-aisle
// widebody with centre bins are the same code with different specs.
// ---------------------------------------------------------------------------

const CELL_H = 22;        // one bin section, measured along the fuselage
const CELL_GAP = 3;
const BIN_PAD = 5;
const BIN_GAP = 11;       // gap between adjacent bins along the length
const SIDE_PAD = 14;
const WING_PAD = 34;      // exterior margin for wings and stabilizers
const TOP_MARGIN = 64;    // room for the nose cone and cockpit
const BOTTOM_MARGIN = 72; // room for the tail cone and fin

const BAG_COLORS = ["#ff8a65", "#ffd54f", "#4fc3f7", "#81c784", "#ba68c8", "#f06292"];

// Boarding speed. "Brisk" is the original pace; the gentler modes stretch the
// same cabin over more time so there is room to think between bags.
const SPEED_MODES = [
  { id: "easy",   name: "Relaxed", note: "Plenty of time", mult: 1.85 },
  { id: "medium", name: "Steady",  note: "Some pressure",  mult: 1.40 },
  { id: "hard",   name: "Brisk",   note: "No slack",       mult: 1.00 },
];

const SCORE = {
  placeBase: 6,
  placePerSize: 4,
  closeBase: 8,
  closePerCapacity: 4,
  oversizedHandled: 4,
  wrongGateCheck: -3,
};

// Column kinds: "bins" (a lengthwise run of overhead bins), "seats" (decor,
// for orientation), "aisle" (where the queue walks).
const FLEET = [
  {
    id: "crj200",
    tail: "N417RG",
    name: "CRJ-200",
    type: "Regional Jet · 50 seats",
    brief: "The bins on the left side are barely deep enough for a coat, and this crowd is hauling rollaboards that were never going to fit.",
    quirks: [
      "Left bins hold only 1–2 sections",
      "Pink-tag bags are far more common than usual",
      "Short cabin — the line reaches the tail fast",
    ],
    difficulty: 1,
    oversizedChance: 0.15,
    sweepSeconds: 82,
    maxBagSize: 3,
    cabinHeight: 1040,
    targetPacked: 78,
    layout: [
      { type: "bins", capacities: [1, 2], width: 58 },
      { type: "seats", width: 22 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 22 },
      { type: "bins", capacities: [2, 3, 4], width: 88 },
    ],
  },
  {
    id: "a320",
    tail: "N228JB",
    name: "A320",
    type: "Narrowbody · 180 seats",
    brief: "A standard single-aisle cabin with even bins down both sides. Good place to learn the rhythm of the boarding front.",
    quirks: [
      "Even bins, 3–6 sections each",
      "The occasional bag needs a pink tag",
    ],
    difficulty: 2,
    oversizedChance: 0.08,
    sweepSeconds: 74,
    maxBagSize: 3,
    cabinHeight: 1560,
    targetPacked: 74,
    layout: [
      { type: "bins", capacities: [3, 4, 5, 6], width: 96 },
      { type: "seats", width: 24 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 24 },
      { type: "bins", capacities: [3, 4, 5, 6], width: 96 },
    ],
  },
  {
    id: "b739",
    tail: "N841DN",
    name: "737-900ER",
    type: "Stretched Narrowbody · 215 seats",
    brief: "A long tube with a full load. The bins are generous, but the line keeps moving and the tail is a long way back.",
    quirks: [
      "Long cabin — lots of bins to keep ahead of",
      "Boarding front accelerates hard late",
      "Big bags are common",
    ],
    difficulty: 3,
    oversizedChance: 0.10,
    sweepSeconds: 92,
    maxBagSize: 3,
    cabinHeight: 1860,
    targetPacked: 70,
    layout: [
      { type: "bins", capacities: [4, 5, 6], width: 96 },
      { type: "seats", width: 24 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 24 },
      { type: "bins", capacities: [4, 5, 6], width: 96 },
    ],
  },
  {
    id: "b77w",
    tail: "N862AA",
    name: "777-300ER",
    type: "Widebody · Twin aisle · 304 seats",
    brief: "Two aisles, four runs of bins. The centre bins are the deepest on the aircraft but they are also the easiest to forget about until the line has already gone by.",
    quirks: [
      "Twin aisle — two queues board at once",
      "Two centre bin runs plus both sides",
      "Deep centre bins reward latching",
    ],
    difficulty: 4,
    oversizedChance: 0.09,
    sweepSeconds: 165,
    maxBagSize: 3,
    cabinHeight: 1700,
    targetPacked: 72,
    layout: [
      { type: "bins", capacities: [3, 4, 5], width: 72 },
      { type: "seats", width: 18 },
      { type: "aisle", width: 46 },
      { type: "seats", width: 18 },
      { type: "bins", capacities: [4, 5, 6], width: 76 },
      { type: "bins", capacities: [4, 5, 6], width: 76 },
      { type: "seats", width: 18 },
      { type: "aisle", width: 46 },
      { type: "seats", width: 18 },
      { type: "bins", capacities: [3, 4, 5], width: 72 },
    ],
  },
];

let canvas = document.getElementById("cabin");
let ctx = canvas.getContext("2d");

const el = (id) => document.getElementById(id);
const canvasWrapEl = el("canvasWrap");
const tailNumEl = el("tailNum");
const tailTypeEl = el("tailType");
const tailLevelEl = el("tailLevel");
const scoreEl = el("score");
const stowedEl = el("stowedCount");
const closedEl = el("closedCount");
const oversizedEl = el("oversizedCount");
const packedEl = el("packedPct");
const progressFillEl = el("progressFill");
const bagPreviewEl = el("bagPreview");
const bagLabelEl = el("bagLabel");
const bagSubEl = el("bagSub");
const gateCheckBtn = el("gateCheckBtn");
const queueRowEl = el("queueRow");
const toastEl = el("toast");
const overlayEl = el("overlay");
const overlayTagEl = el("overlayTag");
const overlayTitleEl = el("overlayTitle");
const overlayStarsEl = el("overlayStars");
const overlayBodyEl = el("overlayBody");
const quirkListEl = el("quirkList");
const speedRowEl = el("speedRow");
const fleetListEl = el("fleetList");
const overlayButtonsEl = el("overlayButtons");
const goalEl = el("goalPanel");
const pauseBtnEl = el("pauseBtn");
const briefArtEl = el("briefArt");

let state = null;
let toastTimer = null;
let careerScore = 0;
let unlocked = 1;
let speedMode = "medium";
let bestStars = {};   // per-aircraft best star count, keyed by spec.id

// --- persistence (best effort; private windows and blocked storage are fine) --
function loadProgress() {
  try {
    const raw = localStorage.getItem("cabinpuzzle.progress");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.unlocked === "number") unlocked = Math.max(1, Math.min(FLEET.length, data.unlocked));
    if (typeof data.careerScore === "number") careerScore = data.careerScore;
    if (SPEED_MODES.some((m) => m.id === data.speed)) speedMode = data.speed;
    if (data.bestStars && typeof data.bestStars === "object") {
      bestStars = data.bestStars;
    }
  } catch (e) { /* storage unavailable — start fresh */ }
}

function saveProgress() {
  try {
    localStorage.setItem("cabinpuzzle.progress", JSON.stringify({ unlocked, careerScore, speed: speedMode, bestStars }));
  } catch (e) { /* storage unavailable — progress is session-only */ }
}

function speedMult() {
  const m = SPEED_MODES.find((x) => x.id === speedMode);
  return m ? m.mult : 1;
}

// --- cabin construction ------------------------------------------------------

function binHeightFor(capacity) {
  return BIN_PAD * 2 + capacity * (CELL_H + CELL_GAP) - CELL_GAP;
}

// Walk the spec's columns left to right, assigning x positions and filling each
// bin column with a run of bins from nose to tail.
function buildCabin(spec) {
  const cabinTop = TOP_MARGIN;
  const cabinBottom = spec.cabinHeight - BOTTOM_MARGIN;
  const columns = [];
  const aisles = [];
  const seatBlocks = [];
  const bins = [];

  let x = WING_PAD + SIDE_PAD;
  spec.layout.forEach((slot) => {
    if (slot.type === "bins") {
      const column = { x, width: slot.width };
      columns.push(column);
      const minHeight = binHeightFor(Math.min(...slot.capacities));
      let y = cabinTop;
      while (y + minHeight <= cabinBottom) {
        const fits = slot.capacities.filter((c) => y + binHeightFor(c) <= cabinBottom);
        const capacity = fits[Math.floor(Math.random() * fits.length)];
        const height = binHeightFor(capacity);
        bins.push({
          column, capacity, y, height,
          cells: new Array(capacity).fill(null),
          bags: [],
          closed: false,
          flashUntil: 0,
          flashColor: null,
        });
        y += height + BIN_GAP;
      }
    } else if (slot.type === "aisle") {
      aisles.push({ x, width: slot.width });
    } else {
      seatBlocks.push({ x, width: slot.width });
    }
    x += slot.width;
  });

  return {
    width: x + SIDE_PAD + WING_PAD,
    height: spec.cabinHeight,
    cabinTop, cabinBottom,
    columns, aisles, seatBlocks, bins,
  };
}

function makeBag(spec, index, total) {
  const difficulty = Math.min(1, index / (total * 0.7));
  const size = 1 + Math.floor(Math.random() * (difficulty > 0.4 ? spec.maxBagSize : spec.maxBagSize - 0.5));
  return {
    size: Math.min(size, spec.maxBagSize),
    color: BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)],
    oversized: Math.random() < spec.oversizedChance,
    revealed: false,
  };
}

function startLevel(levelIndex) {
  const spec = FLEET[levelIndex];
  const cabin = buildCabin(spec);

  // Render at device pixel resolution so the cabin stays crisp on HiDPI
  // displays; all drawing keeps its logical coordinate space.
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cabin.width * dpr);
  canvas.height = Math.round(cabin.height * dpr);
  // Never upscale past native resolution; narrower screens scale it down.
  canvas.style.maxWidth = cabin.width + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const totalSections = cabin.bins.reduce((sum, b) => sum + b.capacity, 0);
  // Supply enough bags to overfill the cabin even after oversized ones are
  // tagged out, so the limit on packing is the player's speed and judgement
  // rather than running out of luggage. (~1.9 sections per stowable bag.)
  const AVG_BAG_SECTIONS = 1.9;
  const queueLength = Math.ceil(
    (totalSections * 1.45) / (AVG_BAG_SECTIONS * (1 - spec.oversizedChance)));
  const queue = [];
  for (let i = 0; i < queueLength; i++) queue.push(makeBag(spec, i, queueLength));

  state = {
    spec, cabin, levelIndex, queue,
    sweepSeconds: spec.sweepSeconds * speedMult(),
    totalSections,
    current: null,
    sweepY: cabin.cabinTop,
    holdT: 6, // pre-boarding grace: the line waits at the door
    score: 0,
    stowed: 0,
    closed: 0,
    oversizedHandled: 0,
    lastTick: performance.now(),
    over: false,
    paused: false,
    popups: [],
    combo: 0,
    lastStowAt: 0,
    missed: 0,
    sealed: 0,   // empty sections the front rolled past, wasted
    sealedAt: 0,
    walkers: cabin.aisles.flatMap((aisle) =>
      [0.0, 0.2, 0.4, 0.6, 0.8].map((phase, i) => ({
        aisle,
        phase,
        shirt: ["#6f8fb8", "#b88f6f", "#7fb08a", "#a884b8", "#b8a06f", "#8aa4c4"][(Math.random() * 6) | 0],
        hair: ["#2c2620", "#4a3826", "#6b5a3e", "#1f2733", "#5c4632"][(Math.random() * 5) | 0],
        skin: ["#e8c39e", "#c68e5e", "#8d5a3b", "#f0d5b8", "#6b4226"][(Math.random() * 5) | 0],
        bag: i % 2 === 0 ? BAG_COLORS[(Math.random() * BAG_COLORS.length) | 0] : null,
      }))
    ),
  };

  pullNextBag();
  tailNumEl.textContent = spec.tail;
  tailTypeEl.textContent = spec.name + " · " + spec.type;
  const mode = SPEED_MODES.find((m) => m.id === speedMode);
  tailLevelEl.textContent = `Level ${levelIndex + 1}/${FLEET.length} · ${mode ? mode.name : ""}`;
  pauseBtnEl.textContent = "II";
  overlayEl.classList.add("hidden");
  requestAnimationFrame(loop);
}

function pauseLevel() {
  if (!state || state.over || state.paused) return;
  state.paused = true;
  state.lastTick = performance.now();
  pauseBtnEl.textContent = "\u25B6";
  clearOverlay();
  overlayTagEl.textContent = "Held at the door";
  overlayTitleEl.textContent = "Paused";
  overlayBodyEl.textContent = "The line is holding. Catch your breath.";
  addButton("Resume boarding", "primary", resumeLevel);
  overlayEl.classList.remove("hidden");
}

function resumeLevel() {
  if (!state || !state.paused) return;
  state.paused = false;
  state.lastTick = performance.now();
  pauseBtnEl.textContent = "II";
  overlayEl.classList.add("hidden");
}

function pullNextBag() {
  state.current = state.queue.length ? state.queue.shift() : null;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

// --- reachability & placement ------------------------------------------------

function cellY(bin, i) {
  return bin.y + BIN_PAD + i * (CELL_H + CELL_GAP);
}

// A section is out of reach once the boarding front has moved past its aft
// edge — the crowd has pushed by and nobody can get back to it.
function cellLocked(bin, i) {
  return state.sweepY > cellY(bin, i) + CELL_H;
}

function binFullyPassed(bin) {
  return state.sweepY > bin.y + bin.height;
}

function isFull(bin) {
  return bin.cells.every((c) => c !== null);
}

// First run of `len` adjacent sections that are both empty and still reachable.
function contiguousFreeRun(bin, len) {
  let runStart = -1;
  let runLen = 0;
  for (let i = 0; i < bin.cells.length; i++) {
    if (bin.cells[i] === null && !cellLocked(bin, i)) {
      if (runLen === 0) runStart = i;
      runLen++;
      if (runLen >= len) return runStart;
    } else {
      runLen = 0;
    }
  }
  return -1;
}

function flash(bin, color, ms) {
  bin.flashUntil = performance.now() + ms;
  bin.flashColor = color;
}

function spawnPopup(x, y, text, color) {
  state.popups.push({ x, y, text, color, born: performance.now() });
}

function handleBinTap(bin) {
  if (state.over || state.paused || bin.closed) return;

  // Tapping a full bin latches it shut, as long as you can still reach it.
  if (isFull(bin)) {
    if (binFullyPassed(bin)) {
      flash(bin, "#ff6b6b", 250);
      showToast("The line already pushed past that bin");
      return;
    }
    const bonus = SCORE.closeBase + SCORE.closePerCapacity * bin.capacity;
    bin.closed = true;
    state.closed += 1;
    state.score += bonus;
    bin.flashUntil = performance.now() + 900;
    bin.flashColor = "#ffd54f";
    bin.latchFlash = true;
    spawnPopup(bin.column.x + bin.column.width / 2, bin.y + bin.height / 2, `\u2691 +${bonus}`, "#ffd54f");
    showToast(`Bin latched! +${bonus}`);
    return;
  }

  if (!state.current) return;

  if (binFullyPassed(bin)) {
    flash(bin, "#ff6b6b", 250);
    showToast("The line already pushed past that bin");
    return;
  }

  if (state.current.oversized) {
    state.current.revealed = true;
    flash(bin, "#ff6ba8", 300);
    showToast("Doesn't fit! It's oversized — needs a pink tag");
    return;
  }

  const start = contiguousFreeRun(bin, state.current.size);
  if (start === -1) {
    flash(bin, "#ff6b6b", 250);
    showToast("No reachable space in that bin");
    return;
  }

  for (let i = start; i < start + state.current.size; i++) {
    bin.cells[i] = state.current.color;
  }
  bin.bags.push({ start, size: state.current.size, color: state.current.color });
  const gained = SCORE.placeBase + SCORE.placePerSize * state.current.size;
  state.score += gained;
  state.stowed += 1;
  flash(bin, "#4caf7d", 250);
  const px = bin.column.x + bin.column.width / 2;
  const py = cellY(bin, start + (state.current.size - 1) / 2);
  spawnPopup(px, py, `+${gained}`, "#7fd6a8");
  const now = performance.now();
  if (now - state.lastStowAt < 3500) {
    state.combo += 1;
    if (state.combo >= 2) {
      const bonus = 2 * state.combo;
      state.score += bonus;
      spawnPopup(px, py - CELL_H, `combo \u00D7${state.combo} +${bonus}`, "#ffd54f");
    }
  }
  state.lastStowAt = now;
  pullNextBag();
}

function gateCheck() {
  if (!state.current || state.over || state.paused) return;
  const px = state.cabin.width / 2;
  const py = Math.max(state.cabin.cabinTop + 50, state.sweepY - 70);
  if (state.current.oversized) {
    state.oversizedHandled += 1;
    state.score += SCORE.oversizedHandled;
    spawnPopup(px, py, `+${SCORE.oversizedHandled}`, "#7fd6a8");
    showToast("Pink-tagged and gate-checked");
  } else {
    state.score += SCORE.wrongGateCheck;
    spawnPopup(px, py, `${SCORE.wrongGateCheck}`, "#ff6b6b");
    showToast("Gate-checked a bag that would have fit");
  }
  pullNextBag();
}

function packedPercent() {
  const filled = state.cabin.bins.reduce(
    (sum, b) => sum + b.cells.filter((c) => c !== null).length, 0);
  return Math.round((filled / state.totalSections) * 100);
}

function tick(dt) {
  if (state.paused) return;
  if (state.holdT > 0) { state.holdT -= dt; return; }
  const { cabinTop, cabinBottom } = state.cabin;
  const span = cabinBottom - cabinTop;
  const progress = (state.sweepY - cabinTop) / span;
  const speed = (span / state.sweepSeconds) * (1 + 1.5 * progress);
  const nextY = state.sweepY + speed * dt;

  // Count sections the front seals while still empty — wasted space.
  for (const bin of state.cabin.bins) {
    for (let i = 0; i < bin.cells.length; i++) {
      const edge = cellY(bin, i) + CELL_H;
      if (bin.cells[i] === null && edge > state.sweepY && edge <= nextY) {
        state.sealed += 1;
        if (!state.sealedAt) state.sealedAt = edge;
      }
    }
  }

  state.sweepY = nextY;
  // Bags still in the queue when the front reaches the tail never boarded.
  if (state.sweepY >= cabinBottom && !state.over) {
    state.missed = state.queue.length + (state.current ? 1 : 0);
  }
  if (state.sweepY >= cabinBottom && !state.over) endLevel();
}

// --- drawing -----------------------------------------------------------------

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCabinShell() {
  const { width, height, cabinTop, cabinBottom, aisles, seatBlocks } = state.cabin;
  const cx = width / 2;
  const fx0 = WING_PAD;          // fuselage left edge
  const fx1 = width - WING_PAD;  // fuselage right edge
  const noseBase = 56;           // where the nose cone meets the straight body
  const tailBase = height - 62;  // where the body starts tapering to the tail

  // wings — swept trapezoids reaching the canvas edge
  const wingY = cabinTop + (cabinBottom - cabinTop) * 0.38;
  ctx.strokeStyle = "#243348";
  ctx.lineWidth = 2;
  [[fx0 + 4, 2], [fx1 - 4, width - 2]].forEach(([rootX, tipX]) => {
    ctx.fillStyle = "#152232";
    ctx.beginPath();
    ctx.moveTo(rootX, wingY);
    ctx.lineTo(tipX, wingY + 52);
    ctx.lineTo(tipX, wingY + 68);
    ctx.lineTo(rootX, wingY + 44);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
  // engines hung on the wings
  ctx.fillStyle = "#22344c";
  [fx0 - 22, fx1 + 10].forEach((ex) => {
    roundRect(ctx, ex, wingY + 24, 12, 26, 5);
    ctx.fill();
    ctx.stroke();
  });

  // horizontal stabilizers at the tail — widebody aircraft carry big
  // cruciform h-tails, so scale them with fuselage width
  const tpY = height - 44;
  const stabReach = state.cabin.width > 340 ? width - 20 : width - 8;
  ctx.fillStyle = "#152232";
  [[fx0 + 10, 8], [fx1 - 10, stabReach]].forEach(([rootX, tipX]) => {
    ctx.beginPath();
    ctx.moveTo(rootX, tpY);
    ctx.lineTo(tipX, tpY + 20);
    ctx.lineTo(tipX, tpY + 30);
    ctx.lineTo(rootX, tpY + 24);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
  // H-tail spar on widebodies: the stabilizers sit on a beam above the fin
  if (state.cabin.width > 340) {
    ctx.beginPath();
    ctx.moveTo(fx0 + 10, tpY + 22);
    ctx.lineTo(stabReach, tpY + 22);
    ctx.stroke();
  }

  // fuselage: nose cone, straight body, tail cone
  // Widebodies get a rounder, fuller cross-section; narrowbodies stay slim.
  const wide = state.cabin.width > 340;
  const fus = ctx.createLinearGradient(fx0, 0, fx1, 0);
  fus.addColorStop(0, "#0e1622");
  fus.addColorStop(0.5, wide ? "#1a2636" : "#16202e");
  fus.addColorStop(1, "#0e1622");
  ctx.fillStyle = fus;
  ctx.beginPath();
  ctx.moveTo(cx, 4);
  ctx.bezierCurveTo(fx0 + 8, 10, fx0, noseBase - 22, fx0, noseBase);
  ctx.lineTo(fx0, tailBase);
  ctx.bezierCurveTo(fx0 + 2, height - 24, cx - 12, height - 8, cx, height - 4);
  ctx.bezierCurveTo(cx + 12, height - 8, fx1 - 2, height - 24, fx1, tailBase);
  ctx.lineTo(fx1, noseBase);
  ctx.bezierCurveTo(fx1, noseBase - 22, fx1 - 8, 10, cx, 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#2b3d55";
  ctx.lineWidth = 2;
  ctx.stroke();

  // cockpit windshield
  ctx.fillStyle = "#22384f";
  ctx.beginPath();
  ctx.moveTo(cx - 24, 32);
  ctx.quadraticCurveTo(cx, 18, cx + 24, 32);
  ctx.lineTo(cx + 16, 42);
  ctx.quadraticCurveTo(cx, 32, cx - 16, 42);
  ctx.closePath();
  ctx.fill();

  // vertical fin seen from above — a spine along the tail cone
  ctx.fillStyle = "#22344c";
  roundRect(ctx, cx - 3, tailBase + 10, 6, height - tailBase - 16, 3);
  ctx.fill();

  aisles.forEach((aisle) => {
    ctx.fillStyle = "#0a1119";
    ctx.fillRect(aisle.x, cabinTop - 14, aisle.width, cabinBottom - cabinTop + 26);
    ctx.strokeStyle = "#1e2b3d";
    ctx.setLineDash([5, 9]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(aisle.x + aisle.width / 2, cabinTop - 10);
    ctx.lineTo(aisle.x + aisle.width / 2, cabinBottom + 8);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // seat blocks: rows of seats read better than a flat band
  ctx.fillStyle = "#1e2a3a";
  seatBlocks.forEach((block) => {
    for (let y = cabinTop; y < cabinBottom - 12; y += 30) {
      // pair of seat cushions with a gap down the middle
      const half = (block.width - 10) / 2;
      roundRect(ctx, block.x + 3, y, half, 22, 4);
      ctx.fill();
      roundRect(ctx, block.x + block.width - 3 - half, y, half, 22, 4);
      ctx.fill();
    }
  });

  // cabin windows down both sides of the fuselage
  ctx.fillStyle = "#2b3d55";
  for (let y = noseBase + 8; y < tailBase - 12; y += 34) {
    roundRect(ctx, fx0 + 4, y, 5, 14, 2.5);
    ctx.fill();
    roundRect(ctx, fx1 - 9, y, 5, 14, 2.5);
    ctx.fill();
  }

  // row numbers every 300 cabin px, so the player can track their progress
  ctx.fillStyle = "#33445e";
  ctx.font = "9px sans-serif";
  for (let y = 300; y < cabinBottom - 60; y += 300) {
    ctx.fillText(`R${Math.round((y - cabinTop) / 30) * 10 + 10}`, 2, y + 3);
  }
}

function drawBin(bin) {
  const x = bin.column.x;
  const w = bin.column.width;
  const now = performance.now();
  const flashing = now < bin.flashUntil;
  const passed = binFullyPassed(bin);

  // Latchable: this bag would exactly fill the bin — the play the score
  // rewards, so make it hum.
  const latchable = !bin.closed && !passed && !!state.current &&
    !state.current.oversized &&
    bin.cells.filter((c) => c === null).length === state.current.size &&
    contiguousFreeRun(bin, state.current.size) !== -1;

  let fillStyle = "#1c2733";
  let strokeStyle = "#2f3f56";
  if (bin.closed) strokeStyle = "#ffd54f";
  else if (passed) { fillStyle = "#141a23"; strokeStyle = "#242a35"; }
  if (latchable) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 240);
    strokeStyle = "#ffd54f";
    fillStyle = `rgba(255, 213, 79, ${0.04 + 0.07 * pulse})`;
  }
  if (flashing) { strokeStyle = bin.flashColor; fillStyle = bin.flashColor + "22"; }

  ctx.fillStyle = fillStyle;
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = bin.closed || latchable ? 3 : 2;
  roundRect(ctx, x, bin.y, w, bin.height, 9);
  ctx.fill();
  ctx.stroke();

  // inner shadow along the top edge — the bin is a hollow shelf
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 6, bin.y + 2.5);
  ctx.lineTo(x + w - 6, bin.y + 2.5);
  ctx.stroke();

  const cellX = x + BIN_PAD;
  const cellW = w - BIN_PAD * 2;
  bin.cells.forEach((cell, i) => {
    const cy = cellY(bin, i);
    if (cell) {
      // occupied — the suitcase itself is drawn after the slots
    } else if (cellLocked(bin, i)) {
      // unreachable empty space — wasted for the rest of the flight.
      // Dark, matte, and crossed out so it never competes with live cells.
      ctx.fillStyle = "#191f28";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(150, 120, 150, 0.35)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let hx = cellX + 5; hx < cellX + cellW - 4; hx += 9) {
        ctx.moveTo(hx, cy + CELL_H - 3);
        ctx.lineTo(hx + CELL_H - 6, cy + 3);
      }
      ctx.stroke();
    } else {
      // live, reachable space — the only cells that matter
      ctx.fillStyle = "#2f4056";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(79, 195, 247, 0.28)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });

  bin.bags.forEach((bag) => drawSuitcase(bin, bag, cellX, cellW));

  if (latchable) {
    ctx.fillStyle = "#ffd54f";
    ctx.font = "600 10px sans-serif";
    ctx.fillText("\u25B2 latch", x + w + 6, bin.y + 12);
  }

  if (bin.closed) {
    ctx.fillStyle = "#ffd54f";
    ctx.font = "12px sans-serif";
    ctx.fillText("\u{1F512}", x + w / 2 - 6, bin.y + bin.height - 1);
  }
}

// One bag drawn as a single piece of luggage spanning its sections: a body
// with a zipper seam, straps, a handle at one end and wheels at the other.
function drawSuitcase(bin, bag, x, w) {
  const y = cellY(bin, bag.start);
  const h = bag.size * (CELL_H + CELL_GAP) - CELL_GAP;

  ctx.fillStyle = bag.color;
  roundRect(ctx, x, y, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // zipper seam along the length
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y + 6);
  ctx.lineTo(x + w / 2, y + h - 6);
  ctx.stroke();
  ctx.setLineDash([]);

  // straps across the body
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(x + 2, y + h * 0.3 - 2, w - 4, 4);
  if (bag.size > 1) ctx.fillRect(x + 2, y + h * 0.7 - 2, w - 4, 4);

  // handle at the forward end
  ctx.strokeStyle = "rgba(0,0,0,0.45)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + w / 2 - 6, y + 5);
  ctx.arcTo(x + w / 2 - 6, y + 1, x + w / 2, y + 1, 4);
  ctx.arcTo(x + w / 2 + 6, y + 1, x + w / 2 + 6, y + 5, 4);
  ctx.lineTo(x + w / 2 + 6, y + 5);
  ctx.stroke();

  // wheels at the aft end
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  [x + 6, x + w - 6].forEach((wx) => {
    ctx.beginPath();
    ctx.arc(wx, y + h - 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// Passengers seen from above, streaming aft toward the boarding front.
//
// Their position is anchored to the front rather than to the cabin, and closes
// on it at a fixed rate, so they always read as walking aft at a steady pace no
// matter how long the cabin is, how fast the line is moving, or that the camera
// is tracking the line at the same time.
const WALK_BAND = 340;   // how far ahead of the front passengers are drawn
const WALK_SPEED = 62;   // cabin px per second, closing on the front

function drawWalkers() {
  const now = performance.now();
  const { cabinTop } = state.cabin;
  // before the doors open, queue them just inside the nose
  const anchor = Math.max(state.sweepY, cabinTop + 70);
  const cycle = WALK_BAND + 60;

  state.walkers.forEach((w) => {
    // offset shrinks over time => walker closes on the front => moves aft
    const off = WALK_BAND - (((now / 1000) * WALK_SPEED + w.phase * cycle) % cycle);
    const y = anchor - off;
    if (y < cabinTop - 4) return; // not into the cabin yet

    const stride = now / 150 + w.phase * 11;
    const cx = w.aisle.x + w.aisle.width / 2 + Math.sin(stride / 2) * 2.5;
    const sway = Math.sin(stride) * 0.14;  // shoulder rotation while walking
    const swing = Math.sin(stride) * 5;    // opposite-arm swing

    // towed rollaboard trails behind, up the aisle
    if (w.bag) {
      const bx = cx - Math.sin(sway * 2) * 2;
      const by = y - 25;
      ctx.strokeStyle = "rgba(170,185,205,0.75)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 8, y - 2);
      ctx.lineTo(bx, by + 7);
      ctx.stroke();
      ctx.fillStyle = w.bag;
      roundRect(ctx, bx - 7, by - 8, 14, 17, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // arms, swinging alternately
    ctx.fillStyle = w.skin;
    [-1, 1].forEach((side) => {
      ctx.beginPath();
      ctx.arc(cx + side * 11 * Math.cos(sway), y + side * swing, 3.2, 0, Math.PI * 2);
      ctx.fill();
    });

    // shoulders
    ctx.fillStyle = w.shirt;
    ctx.beginPath();
    ctx.ellipse(cx, y, 11.5, 6.5, sway, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // head, with hair toward the nose so the facing direction reads
    ctx.fillStyle = w.skin;
    ctx.beginPath();
    ctx.arc(cx, y, 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = w.hair;
    ctx.beginPath();
    ctx.arc(cx, y - 1.1, 4.4, Math.PI, Math.PI * 2);
    ctx.fill();
  });
}

function drawSweep() {
  const { width, cabinBottom } = state.cabin;
  const sy = Math.min(state.sweepY, cabinBottom);

  // Everything the front has passed is sealed — dim it so "behind the line"
  // reads at a glance, not by tracing each crossed-out cell.
  ctx.fillStyle = "rgba(5, 9, 14, 0.5)";
  ctx.fillRect(0, sy, width, cabinBottom - sy + 10);

  const grad = ctx.createLinearGradient(0, sy - 26, 0, sy + 4);
  grad.addColorStop(0, "rgba(79,195,247,0)");
  grad.addColorStop(1, "rgba(79,195,247,0.28)");
  ctx.fillStyle = grad;
  ctx.fillRect(WING_PAD + 4, sy - 26, width - WING_PAD * 2 - 8, 30);
  // glow pass under the line itself
  ctx.save();
  ctx.shadowColor = "#4fc3f7";
  ctx.shadowBlur = 8;
  ctx.strokeStyle = "#4fc3f7";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(WING_PAD + 6, sy);
  ctx.lineTo(width - WING_PAD - 6, sy);
  ctx.stroke();
  ctx.restore();

  if (state.holdT > 0) {
    ctx.fillStyle = "#4fc3f7";
    ctx.font = "600 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`Boarding begins in ${Math.ceil(state.holdT)}… stow ahead!`, width / 2, sy + 18);
    ctx.textAlign = "left";
  }
}

// --- floating score popups & sealed-space readout ----------------------------

function drawPopups() {
  const now = performance.now();
  state.popups = state.popups.filter((p) => now - p.born < 900);
  state.popups.forEach((p) => {
    const age = (now - p.born) / 900;
    ctx.globalAlpha = 1 - age;
    ctx.fillStyle = p.color;
    ctx.font = "700 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y - 14 - age * 34);
    ctx.textAlign = "left";
  });
  ctx.globalAlpha = 1;
}

// Where the front last sealed empty space, if it still sits on screen.
function drawSealedWarning() {
  if (state.sealedAt) {
    const { cabinTop } = state.cabin;
    const y = Math.max(cabinTop + 20, state.sealedAt);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
    ctx.fillStyle = `rgba(255, 107, 107, ${0.55 + 0.35 * pulse})`;
    ctx.font = "600 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("\u26A0 space sealed \u2014 wasted", state.cabin.width / 2, y + 4);
    ctx.textAlign = "left";
  }
}

function draw() {
  ctx.clearRect(0, 0, state.cabin.width, state.cabin.height);
  drawCabinShell();
  state.cabin.bins.forEach(drawBin);
  drawWalkers();
  drawSweep();
  drawSealedWarning();
  drawPopups();
}

function updateHUD() {
  scoreEl.textContent = state.score;
  stowedEl.textContent = state.stowed;
  closedEl.textContent = state.closed;
  oversizedEl.textContent = state.oversizedHandled;
  packedEl.textContent = packedPercent() + "%";

  const { cabinTop, cabinBottom } = state.cabin;
  const pct = Math.min(100, ((state.sweepY - cabinTop) / (cabinBottom - cabinTop)) * 100);
  progressFillEl.style.width = `${pct}%`;

  const packedNow = packedPercent();
  goalEl.textContent =
    `Goal: pack the cabin to ${state.spec.targetPacked}% — you're at ${packedNow}%` +
    (packedNow >= state.spec.targetPacked
      ? " \u2713"
      : ` \u00B7 ${state.sealed} sealed empty`);
  goalEl.classList.toggle("ok", packedNow >= state.spec.targetPacked);

  if (state.current) {
    bagPreviewEl.style.height = `${state.current.size * 14 + 8}px`;
    bagPreviewEl.style.background = state.current.color;
    if (state.current.revealed) {
      bagLabelEl.textContent = "Oversized bag — won't fit anywhere";
      bagSubEl.textContent = "Tap the pink tag button to gate-check it.";
      bagSubEl.classList.add("warn");
      gateCheckBtn.classList.add("pulse");
    } else {
      const bagNames = { 1: "Personal item", 2: "Carry-on", 3: "Rollaboard" };
      bagLabelEl.textContent = `${bagNames[state.current.size] || "Bag"} — ${state.current.size} section${state.current.size > 1 ? "s" : ""}`;
      bagSubEl.textContent = "Tap bin space ahead of the boarding line.";
      bagSubEl.classList.remove("warn");
      gateCheckBtn.classList.remove("pulse");
    }
    gateCheckBtn.disabled = false;
  } else {
    bagPreviewEl.style.background = "#3a4a63";
    bagLabelEl.textContent = state.over ? "" : "No more bags";
    bagSubEl.textContent = "";
    bagSubEl.classList.remove("warn");
    gateCheckBtn.disabled = true;
    gateCheckBtn.classList.remove("pulse");
  }

  queueRowEl.innerHTML = "";
  state.queue.slice(0, 14).forEach((b) => {
    const item = document.createElement("div");
    item.className = "queueBag";
    item.style.height = `${b.size * 8 + 6}px`;
    item.style.background = b.color;
    queueRowEl.appendChild(item);
  });
}

function updateCamera() {
  const scale = canvas.clientWidth / state.cabin.width;
  const view = canvasWrapEl.clientHeight;
  const cssH = state.cabin.height * scale;
  const target = state.sweepY * scale - view * 0.42;
  canvasWrapEl.scrollTop = Math.max(0, Math.min(cssH - view, target));
}

function loop(now) {
  if (!state.over) {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    tick(Math.min(dt, 0.1));
  }
  draw();
  updateHUD();
  updateCamera();
  if (!state.over) requestAnimationFrame(loop);
}

// --- overlays & level flow ---------------------------------------------------

// Best-stars line for the fleet screen, e.g. "★★☆".
function starsHtml(specId) {
  const n = bestStars[specId] || 0;
  return `<span class="on">${"\u2605".repeat(n)}</span><span class="off">${"\u2605".repeat(3 - n)}</span>`;
}

// --- briefing art -------------------------------------------------------------
// A small, per-aircraft top-down silhouette so the fleet screen shows each
// tail's real proportions instead of the same box four times.
function drawBriefArt(spec) {
  const c = briefArtEl;
  const bctx = c.getContext("2d");
  const W = c.width, H = c.height;
  bctx.clearRect(0, 0, W, H);
  const cx = W / 2;
  const wide = spec.id === "b77w";
  const fw = wide ? 74 : 58;              // fuselage width
  const fx0 = cx - fw / 2, fx1 = cx + fw / 2;
  const noseBase = 44, tailBase = H - 46;

  // wings (widebodies carry much bigger ones)
  const wingY = noseBase + (tailBase - noseBase) * 0.4;
  const reach = wide ? W - 6 : W - 26;
  bctx.fillStyle = "#152232";
  bctx.strokeStyle = "#243348";
  bctx.lineWidth = 1.5;
  [[fx0 + 4, 6], [fx1 - 4, W - 6]].forEach(([rx, tx]) => {
    bctx.beginPath();
    bctx.moveTo(rx, wingY);
    bctx.lineTo(tx, wingY + 34);
    bctx.lineTo(tx, wingY + 46);
    bctx.lineTo(rx, wingY + 30);
    bctx.closePath();
    bctx.fill();
    bctx.stroke();
  });
  // tail surfaces
  const tpY = H - 34;
  bctx.beginPath();
  bctx.moveTo(fx0 + 6, tpY);
  bctx.lineTo(10, tpY + 18);
  bctx.lineTo(10, tpY + 26);
  bctx.lineTo(fx0 + 6, tpY + 18);
  bctx.closePath();
  bctx.fill();
  bctx.beginPath();
  bctx.moveTo(fx1 - 6, tpY);
  bctx.lineTo(W - 10, tpY + 18);
  bctx.lineTo(W - 10, tpY + 26);
  bctx.lineTo(fx1 - 6, tpY + 18);
  bctx.closePath();
  bctx.fill();

  // fuselage
  bctx.fillStyle = "#18232f";
  bctx.strokeStyle = "#2b3d55";
  bctx.lineWidth = 2;
  bctx.beginPath();
  bctx.moveTo(cx, 8);
  bctx.bezierCurveTo(fx0, 12, fx0, noseBase - 14, fx0, noseBase);
  bctx.lineTo(fx0, tailBase);
  bctx.bezierCurveTo(fx0, H - 20, cx - 8, H - 8, cx, H - 6);
  bctx.bezierCurveTo(cx + 8, H - 8, fx1, H - 20, fx1, tailBase);
  bctx.lineTo(fx1, noseBase);
  bctx.bezierCurveTo(fx1, noseBase - 14, fx1, 12, cx, 8);
  bctx.closePath();
  bctx.fill();
  bctx.stroke();

  // cockpit
  bctx.fillStyle = "#22384f";
  bctx.beginPath();
  bctx.moveTo(cx - 14, 26);
  bctx.quadraticCurveTo(cx, 16, cx + 14, 26);
  bctx.lineTo(cx + 9, 34);
  bctx.quadraticCurveTo(cx, 26, cx - 9, 34);
  bctx.closePath();
  bctx.fill();

  // fin
  bctx.fillStyle = "#22344c";
  bctx.fillRect(cx - 2, tailBase + 8, 4, H - tailBase - 14);

  // windows
  bctx.fillStyle = "#2b3d55";
  for (let y = noseBase + 6; y < tailBase - 10; y += 22) {
    bctx.fillRect(fx0 + 4, y, 4, 10);
    bctx.fillRect(fx1 - 8, y, 4, 10);
  }

  // bin row count readout
  const capSum = (spec.layout.find((s) => s.type === "bins") || {}).capacities || [];
  bctx.fillStyle = "#8fa2bd";
  bctx.font = "10px sans-serif";
  bctx.textAlign = "center";
  bctx.fillText(`${capSum.length} bin sizes · ${spec.type}`, cx, H - 2);
  bctx.textAlign = "left";
  briefArtEl.style.display = "block";
}

function clearOverlay() {
  quirkListEl.innerHTML = "";
  speedRowEl.innerHTML = "";
  fleetListEl.innerHTML = "";
  overlayButtonsEl.innerHTML = "";
  overlayBodyEl.textContent = "";
  overlayStarsEl.textContent = "";
  briefArtEl.style.display = "none";
}

function addButton(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.addEventListener("click", onClick);
  overlayButtonsEl.appendChild(b);
  return b;
}

function showBriefing(levelIndex) {
  const spec = FLEET[levelIndex];
  clearOverlay();
  overlayTagEl.textContent = `Level ${levelIndex + 1} · ${spec.tail}`;
  overlayTitleEl.textContent = spec.name;
  drawBriefArt(spec);
  overlayBodyEl.textContent = spec.brief;
  spec.quirks.forEach((q) => {
    const li = document.createElement("li");
    li.textContent = q;
    quirkListEl.appendChild(li);
  });
  const goal = document.createElement("li");
  goal.style.borderLeftColor = "#4caf7d";
  goal.textContent = `Goal: finish with the cabin at least ${spec.targetPacked}% packed`;
  quirkListEl.appendChild(goal);

  const diff = document.createElement("li");
  diff.style.borderLeftColor = "#ffb74d";
  const names = { 1: "Training flight", 2: "Routine turn", 3: "Tight turn", 4: "Peak season" };
  diff.textContent = `Difficulty: ${names[spec.difficulty]} ` +
    "\u25CF".repeat(spec.difficulty) + "\u25CB".repeat(4 - spec.difficulty);
  quirkListEl.appendChild(diff);

  SPEED_MODES.forEach((m) => {
    const b = document.createElement("button");
    b.className = "speedBtn" + (m.id === speedMode ? " sel" : "");
    b.innerHTML = `<span class="sname">${m.name}</span>${m.note}`;
    b.addEventListener("click", () => {
      speedMode = m.id;
      saveProgress();
      showBriefing(levelIndex); // re-render so the selection and pips update
    });
    speedRowEl.appendChild(b);
  });

  addButton("Begin boarding", "primary", () => startLevel(levelIndex));
  if (FLEET.length > 1) addButton("Choose aircraft", "ghost", showFleetSelect);
  overlayEl.classList.remove("hidden");
}

function showFleetSelect() {
  clearOverlay();
  overlayTagEl.textContent = "Fleet";
  overlayTitleEl.textContent = "Choose an aircraft";
  overlayBodyEl.textContent = `Career score: ${careerScore}`;
  FLEET.forEach((spec, i) => {
    const btn = document.createElement("button");
    btn.className = "fleetBtn" + (i < unlocked - 1 ? " done" : "");
    btn.disabled = i >= unlocked;
    const pips = "\u25CF".repeat(spec.difficulty) + "\u25CB".repeat(4 - spec.difficulty);
    btn.innerHTML =
      `<span class="fdiff">${pips}</span>` +
      `<span class="fname">${spec.name}</span>` +
      `<span class="fsub">${i >= unlocked ? "Locked" : spec.type}</span>` +
      `<span class="fstars">${starsHtml(spec.id)}</span>`;
    btn.addEventListener("click", () => showBriefing(i));
    fleetListEl.appendChild(btn);
  });
  overlayEl.classList.remove("hidden");
}

function endLevel() {
  state.over = true;
  const packed = packedPercent();
  const spec = state.spec;
  const passed = packed >= spec.targetPacked;
  careerScore += state.score;
  if (passed && state.levelIndex + 1 >= unlocked) {
    unlocked = Math.min(FLEET.length, state.levelIndex + 2);
  }
  saveProgress();

  clearOverlay();
  overlayTagEl.textContent = passed ? "Doors closed" : "Delayed departure";
  overlayTitleEl.textContent = passed ? `${spec.name} dispatched` : `${spec.name} left space on the table`;

  // Star rating: meeting the target is 1★; beat it by 5% or 15% for more.
  const stars = !passed ? 0 :
    packed >= spec.targetPacked + 15 ? 3 :
    packed >= spec.targetPacked + 5 ? 2 : 1;
  if (stars > (bestStars[spec.id] || 0)) {
    bestStars[spec.id] = stars;
    saveProgress();
  }
  overlayStarsEl.innerHTML = stars
    ? `<span class="on">${"\u2605".repeat(stars)}</span><span class="off">${"\u2605".repeat(3 - stars)}</span>`
    : "";

  let body =
    `Stowed ${state.stowed} bags, latched ${state.closed} bins and pink-tagged ` +
    `${state.oversizedHandled} oversized bags. The cabin ended ${packed}% packed ` +
    `(target ${spec.targetPacked}%). Score ${state.score} · career ${careerScore}.`;
  if (!passed) {
    body += ` ${state.sealed} sections were sealed empty under the line and ` +
      `${state.missed} bags never got stowed — keep the bins full ahead of the front, ` +
      `then latch them for the bonus.`;
  }
  overlayBodyEl.textContent = body;

  const hasNext = state.levelIndex + 1 < FLEET.length;
  if (passed && hasNext) {
    addButton("Next aircraft", "primary", () => showBriefing(state.levelIndex + 1));
  } else if (passed) {
    addButton("Fly it again", "primary", () => showBriefing(state.levelIndex));
  } else {
    addButton("Try again", "primary", () => showBriefing(state.levelIndex));
  }
  addButton("Choose aircraft", "ghost", showFleetSelect);
  overlayEl.classList.remove("hidden");
}

// --- input -------------------------------------------------------------------

canvas.addEventListener("click", (e) => {
  if (!state || state.over) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (state.cabin.width / rect.width);
  const y = (e.clientY - rect.top) * (state.cabin.height / rect.height);

  const hit = state.cabin.bins.find((bin) =>
    x >= bin.column.x && x <= bin.column.x + bin.column.width &&
    y >= bin.y && y <= bin.y + bin.height);
  if (hit) handleBinTap(hit);
});

gateCheckBtn.addEventListener("click", gateCheck);
pauseBtnEl.addEventListener("click", () => {
  if (state && state.paused) resumeLevel();
  else pauseLevel();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "p" || e.key === "P") {
    if (state && state.paused) resumeLevel();
    else if (state && !state.over) pauseLevel();
  }
});

loadProgress();
showBriefing(Math.min(unlocked - 1, FLEET.length - 1));
  </script>
</body>
</html>
