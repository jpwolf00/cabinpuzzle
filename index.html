<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Overhead Bin: Boarding Rush</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f1620;
  color: #e8edf4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

.panel {
  width: 100%;
  max-width: 460px;
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 10px;
}

#tailStrip {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 14px;
}

#tailNum { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
#tailType { font-size: 11px; color: #8fa2bd; }
#tailLevel { margin-left: auto; font-size: 10px; color: #8fa2bd; text-transform: uppercase; letter-spacing: 0.05em; }

#hud {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  justify-content: space-between;
}

#hud .stat { display: flex; flex-direction: column; align-items: center; min-width: 44px; }

#hud .label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  white-space: nowrap;
}

#hud span:not(.label) { font-size: 17px; font-weight: 700; }

#progressWrap { width: 100%; max-width: 460px; }

#progressLabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8fa2bd;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}

#progressBar {
  width: 100%;
  height: 8px;
  background: #1c2733;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #26344a;
}

#progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #4caf7d, #ffb74d, #ff6b6b); }

#canvasWrap {
  width: 100%;
  max-width: 460px;
  border-radius: 14px;
  border: 1px solid #26344a;
  background: #0d141d;
  height: 520px;
  max-height: 58vh;
  overflow: hidden; /* camera-follow sets scrollTop; the player never scrolls */
}

canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }

#bagPanel { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }

#bagPreview {
  width: 34px;
  border-radius: 5px;
  background: #3a4a63;
  flex-shrink: 0;
  height: 26px;
  transition: background 0.15s, height 0.15s;
  position: relative;
  margin-top: 6px;
}

/* telescoping handle — makes the blocks read as luggage */
#bagPreview::before, .queueBag::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 8px;
  border: 2px solid rgba(200, 214, 232, 0.6);
  border-bottom: none;
  border-radius: 5px 5px 0 0;
}

#bagInfo { flex: 1; min-width: 0; }
#bagLabel { font-size: 13px; color: #e8edf4; font-weight: 600; }
#bagSub { font-size: 11px; color: #8fa2bd; margin-top: 2px; }
#bagSub.warn { color: #ff8fb0; font-weight: 600; }

#gateCheckBtn {
  background: #3a2733;
  color: #ffb4c6;
  border: 1px solid #5c3444;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

#gateCheckBtn.pulse { background: #ff6b95; color: #2a0d18; border-color: #ff6b95; }
#gateCheckBtn:disabled { opacity: 0.35; cursor: default; }

#queueArea { padding: 8px 14px; }

#queueArea .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #8fa2bd;
  margin-bottom: 5px;
}

#queueRow { display: flex; gap: 8px; min-height: 26px; overflow-x: auto; align-items: flex-end; padding-top: 8px; }
.queueBag { width: 18px; border-radius: 3px; background: #3a4a63; flex-shrink: 0; position: relative; }

#toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #1c2733;
  border: 1px solid #2f3f56;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 5;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 15, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow-y: auto;
}

#overlay.hidden { display: none; }

#overlayCard {
  background: #17212e;
  border: 1px solid #26344a;
  border-radius: 14px;
  padding: 24px 26px;
  text-align: center;
  max-width: 400px;
  width: 100%;
}

#overlayTag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #4fc3f7;
}

#overlayCard h1 { margin: 6px 0 4px; font-size: 21px; }
#overlayCard p { font-size: 13.5px; line-height: 1.6; color: #c3d0e2; margin: 10px 0; }

#quirkList {
  list-style: none;
  padding: 0;
  margin: 12px 0;
  text-align: left;
  font-size: 12.5px;
  color: #c3d0e2;
}

#quirkList li {
  padding: 6px 10px;
  background: #1c2733;
  border-left: 3px solid #4fc3f7;
  border-radius: 4px;
  margin-bottom: 6px;
}

.btnRow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }

button.primary {
  background: #2f6fed;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
}

button.primary:hover { background: #4a83f5; }

button.ghost {
  background: transparent;
  color: #8fa2bd;
  border: 1px solid #2f3f56;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
}

button.ghost:hover { color: #e8edf4; border-color: #4a5f7f; }

#fleetList { margin: 14px 0 4px; display: flex; flex-direction: column; gap: 6px; }

.fleetBtn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1c2733;
  border: 1px solid #2f3f56;
  border-radius: 8px;
  padding: 9px 12px;
  cursor: pointer;
  color: #e8edf4;
  font-size: 13px;
  text-align: left;
  width: 100%;
}

.fleetBtn:hover:not(:disabled) { border-color: #4fc3f7; }
.fleetBtn:disabled { opacity: 0.4; cursor: default; }
.fleetBtn .fname { font-weight: 600; }
.fleetBtn .fsub { font-size: 11px; color: #8fa2bd; margin-left: auto; }
.fleetBtn.done { border-left: 3px solid #4caf7d; }
</style>
</head>
<body>
  <div class="panel" id="tailStrip">
    <span id="tailNum">—</span>
    <span id="tailType"></span>
    <span id="tailLevel"></span>
  </div>

  <div class="panel" id="hud">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat"><span class="label">Stowed</span><span id="stowedCount">0</span></div>
    <div class="stat"><span class="label">Latched</span><span id="closedCount">0</span></div>
    <div class="stat"><span class="label">Pink Tag</span><span id="oversizedCount">0</span></div>
    <div class="stat"><span class="label">Packed</span><span id="packedPct">0%</span></div>
  </div>

  <div id="progressWrap">
    <div id="progressLabel"><span>Nose</span><span>Boarding front</span><span>Tail</span></div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="canvasWrap"><canvas id="cabin"></canvas></div>

  <div class="panel" id="bagPanel">
    <div id="bagPreview"></div>
    <div id="bagInfo">
      <div id="bagLabel">Waiting for boarding...</div>
      <div id="bagSub">Tap bin space ahead of the boarding line.</div>
    </div>
    <button id="gateCheckBtn">Pink tag<br>(gate-check)</button>
  </div>

  <div class="panel" id="queueArea">
    <div class="label">Next in the aisle</div>
    <div id="queueRow"></div>
  </div>

  <div id="toast"></div>

  <div id="overlay">
    <div id="overlayCard">
      <div id="overlayTag"></div>
      <h1 id="overlayTitle"></h1>
      <p id="overlayBody"></p>
      <ul id="quirkList"></ul>
      <div id="fleetList"></div>
      <div class="btnRow" id="overlayButtons"></div>
    </div>
  </div>

  <script>
// ---------------------------------------------------------------------------
// Overhead Bin: Boarding Rush
//
// Top-down cabin. Overhead bins run lengthwise along the fuselage. Passengers
// stream aft and a boarding "front" sweeps down with them; any bin section the
// front has passed is out of reach for good, so empty space left forward is
// wasted. Some bags are secretly oversized and only reveal it when you try to
// stow them — those need a pink tag. Fill a bin and latch it shut before the
// line passes for a bonus.
//
// Cabins are data-driven: an aircraft spec lists columns across the fuselage
// (bin runs, seat blocks, aisles), so a cramped regional jet and a twin-aisle
// widebody with centre bins are the same code with different specs.
// ---------------------------------------------------------------------------

const CELL_H = 22;        // one bin section, measured along the fuselage
const CELL_GAP = 3;
const BIN_PAD = 5;
const BIN_GAP = 11;       // gap between adjacent bins along the length
const SIDE_PAD = 14;
const WING_PAD = 34;      // exterior margin for wings and stabilizers
const TOP_MARGIN = 64;    // room for the nose cone and cockpit
const BOTTOM_MARGIN = 72; // room for the tail cone and fin

const BAG_COLORS = ["#ff8a65", "#ffd54f", "#4fc3f7", "#81c784", "#ba68c8", "#f06292"];

const SCORE = {
  placeBase: 6,
  placePerSize: 4,
  closeBase: 8,
  closePerCapacity: 4,
  oversizedHandled: 4,
  wrongGateCheck: -3,
};

// Column kinds: "bins" (a lengthwise run of overhead bins), "seats" (decor,
// for orientation), "aisle" (where the queue walks).
const FLEET = [
  {
    id: "crj200",
    tail: "N417RG",
    name: "CRJ-200",
    type: "Regional Jet · 50 seats",
    brief: "The bins on the left side are barely deep enough for a coat, and this crowd is hauling rollaboards that were never going to fit.",
    quirks: [
      "Left bins hold only 1–2 sections",
      "Nearly a third of bags need a pink tag",
      "Short cabin — the line reaches the tail fast",
    ],
    oversizedChance: 0.32,
    sweepSeconds: 105,
    maxBagSize: 3,
    cabinHeight: 1040,
    targetPacked: 45,
    layout: [
      { type: "bins", capacities: [1, 2], width: 58 },
      { type: "seats", width: 22 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 22 },
      { type: "bins", capacities: [2, 3, 4], width: 88 },
    ],
  },
  {
    id: "a320",
    tail: "N228JB",
    name: "A320",
    type: "Narrowbody · 180 seats",
    brief: "A standard single-aisle cabin with even bins down both sides. Good place to learn the rhythm of the boarding front.",
    quirks: [
      "Even bins, 3–6 sections each",
      "About 1 in 6 bags needs a pink tag",
    ],
    oversizedChance: 0.16,
    sweepSeconds: 150,
    maxBagSize: 3,
    cabinHeight: 1560,
    targetPacked: 55,
    layout: [
      { type: "bins", capacities: [3, 4, 5, 6], width: 96 },
      { type: "seats", width: 24 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 24 },
      { type: "bins", capacities: [3, 4, 5, 6], width: 96 },
    ],
  },
  {
    id: "b739",
    tail: "N841DN",
    name: "737-900ER",
    type: "Stretched Narrowbody · 215 seats",
    brief: "A long tube with a full load. The bins are generous, but the line keeps moving and the tail is a long way back.",
    quirks: [
      "Long cabin — lots of bins to keep ahead of",
      "Boarding front accelerates hard late",
      "Big bags are common",
    ],
    oversizedChance: 0.2,
    sweepSeconds: 175,
    maxBagSize: 3,
    cabinHeight: 1860,
    targetPacked: 58,
    layout: [
      { type: "bins", capacities: [4, 5, 6], width: 96 },
      { type: "seats", width: 24 },
      { type: "aisle", width: 58 },
      { type: "seats", width: 24 },
      { type: "bins", capacities: [4, 5, 6], width: 96 },
    ],
  },
  {
    id: "b77w",
    tail: "N862AA",
    name: "777-300ER",
    type: "Widebody · Twin aisle · 304 seats",
    brief: "Two aisles, four runs of bins. The centre bins are the deepest on the aircraft but they are also the easiest to forget about until the line has already gone by.",
    quirks: [
      "Twin aisle — two queues board at once",
      "Two centre bin runs plus both sides",
      "Deep centre bins reward latching",
    ],
    oversizedChance: 0.18,
    sweepSeconds: 170,
    maxBagSize: 3,
    cabinHeight: 1700,
    targetPacked: 55,
    layout: [
      { type: "bins", capacities: [3, 4, 5], width: 72 },
      { type: "seats", width: 18 },
      { type: "aisle", width: 46 },
      { type: "seats", width: 18 },
      { type: "bins", capacities: [4, 5, 6], width: 76 },
      { type: "bins", capacities: [4, 5, 6], width: 76 },
      { type: "seats", width: 18 },
      { type: "aisle", width: 46 },
      { type: "seats", width: 18 },
      { type: "bins", capacities: [3, 4, 5], width: 72 },
    ],
  },
];

const canvas = document.getElementById("cabin");
const ctx = canvas.getContext("2d");

const el = (id) => document.getElementById(id);
const canvasWrapEl = el("canvasWrap");
const tailNumEl = el("tailNum");
const tailTypeEl = el("tailType");
const tailLevelEl = el("tailLevel");
const scoreEl = el("score");
const stowedEl = el("stowedCount");
const closedEl = el("closedCount");
const oversizedEl = el("oversizedCount");
const packedEl = el("packedPct");
const progressFillEl = el("progressFill");
const bagPreviewEl = el("bagPreview");
const bagLabelEl = el("bagLabel");
const bagSubEl = el("bagSub");
const gateCheckBtn = el("gateCheckBtn");
const queueRowEl = el("queueRow");
const toastEl = el("toast");
const overlayEl = el("overlay");
const overlayTagEl = el("overlayTag");
const overlayTitleEl = el("overlayTitle");
const overlayBodyEl = el("overlayBody");
const quirkListEl = el("quirkList");
const fleetListEl = el("fleetList");
const overlayButtonsEl = el("overlayButtons");

let state = null;
let toastTimer = null;
let careerScore = 0;
let unlocked = 1;

// --- persistence (best effort; private windows and blocked storage are fine) --
function loadProgress() {
  try {
    const raw = localStorage.getItem("cabinpuzzle.progress");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.unlocked === "number") unlocked = Math.max(1, Math.min(FLEET.length, data.unlocked));
    if (typeof data.careerScore === "number") careerScore = data.careerScore;
  } catch (e) { /* storage unavailable — start fresh */ }
}

function saveProgress() {
  try {
    localStorage.setItem("cabinpuzzle.progress", JSON.stringify({ unlocked, careerScore }));
  } catch (e) { /* storage unavailable — progress is session-only */ }
}

// --- cabin construction ------------------------------------------------------

function binHeightFor(capacity) {
  return BIN_PAD * 2 + capacity * (CELL_H + CELL_GAP) - CELL_GAP;
}

// Walk the spec's columns left to right, assigning x positions and filling each
// bin column with a run of bins from nose to tail.
function buildCabin(spec) {
  const cabinTop = TOP_MARGIN;
  const cabinBottom = spec.cabinHeight - BOTTOM_MARGIN;
  const columns = [];
  const aisles = [];
  const seatBlocks = [];
  const bins = [];

  let x = WING_PAD + SIDE_PAD;
  spec.layout.forEach((slot) => {
    if (slot.type === "bins") {
      const column = { x, width: slot.width };
      columns.push(column);
      const minHeight = binHeightFor(Math.min(...slot.capacities));
      let y = cabinTop;
      while (y + minHeight <= cabinBottom) {
        const fits = slot.capacities.filter((c) => y + binHeightFor(c) <= cabinBottom);
        const capacity = fits[Math.floor(Math.random() * fits.length)];
        const height = binHeightFor(capacity);
        bins.push({
          column, capacity, y, height,
          cells: new Array(capacity).fill(null),
          bags: [],
          closed: false,
          flashUntil: 0,
          flashColor: null,
        });
        y += height + BIN_GAP;
      }
    } else if (slot.type === "aisle") {
      aisles.push({ x, width: slot.width });
    } else {
      seatBlocks.push({ x, width: slot.width });
    }
    x += slot.width;
  });

  return {
    width: x + SIDE_PAD + WING_PAD,
    height: spec.cabinHeight,
    cabinTop, cabinBottom,
    columns, aisles, seatBlocks, bins,
  };
}

function makeBag(spec, index, total) {
  const difficulty = Math.min(1, index / (total * 0.7));
  const size = 1 + Math.floor(Math.random() * (difficulty > 0.4 ? spec.maxBagSize : spec.maxBagSize - 0.5));
  return {
    size: Math.min(size, spec.maxBagSize),
    color: BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)],
    oversized: Math.random() < spec.oversizedChance,
    revealed: false,
  };
}

function startLevel(levelIndex) {
  const spec = FLEET[levelIndex];
  const cabin = buildCabin(spec);

  canvas.width = cabin.width;
  canvas.height = cabin.height;
  // Never upscale past native resolution; narrower screens scale it down.
  canvas.style.maxWidth = cabin.width + "px";

  const totalSections = cabin.bins.reduce((sum, b) => sum + b.capacity, 0);
  const queueLength = Math.ceil(totalSections / 1.4);
  const queue = [];
  for (let i = 0; i < queueLength; i++) queue.push(makeBag(spec, i, queueLength));

  state = {
    spec, cabin, levelIndex, queue,
    totalSections,
    current: null,
    sweepY: cabin.cabinTop,
    holdT: 6, // pre-boarding grace: the line waits at the door
    score: 0,
    stowed: 0,
    closed: 0,
    oversizedHandled: 0,
    lastTick: performance.now(),
    over: false,
    walkers: cabin.aisles.flatMap((aisle) =>
      [0.05, 0.3, 0.55, 0.78].map((phase, i) => ({
        aisle,
        phase,
        shirt: ["#6f8fb8", "#b88f6f", "#7fb08a", "#a884b8", "#b8a06f", "#8aa4c4"][(Math.random() * 6) | 0],
        hair: ["#2c2620", "#4a3826", "#6b5a3e", "#1f2733", "#5c4632"][(Math.random() * 5) | 0],
        skin: ["#e8c39e", "#c68e5e", "#8d5a3b", "#f0d5b8", "#6b4226"][(Math.random() * 5) | 0],
        bag: i % 2 === 0 ? BAG_COLORS[(Math.random() * BAG_COLORS.length) | 0] : null,
      }))
    ),
  };

  pullNextBag();
  tailNumEl.textContent = spec.tail;
  tailTypeEl.textContent = spec.name + " · " + spec.type;
  tailLevelEl.textContent = `Level ${levelIndex + 1} of ${FLEET.length}`;
  overlayEl.classList.add("hidden");
  requestAnimationFrame(loop);
}

function pullNextBag() {
  state.current = state.queue.length ? state.queue.shift() : null;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

// --- reachability & placement ------------------------------------------------

function cellY(bin, i) {
  return bin.y + BIN_PAD + i * (CELL_H + CELL_GAP);
}

// A section is out of reach once the boarding front has moved past its aft
// edge — the crowd has pushed by and nobody can get back to it.
function cellLocked(bin, i) {
  return state.sweepY > cellY(bin, i) + CELL_H;
}

function binFullyPassed(bin) {
  return state.sweepY > bin.y + bin.height;
}

function isFull(bin) {
  return bin.cells.every((c) => c !== null);
}

// First run of `len` adjacent sections that are both empty and still reachable.
function contiguousFreeRun(bin, len) {
  let runStart = -1;
  let runLen = 0;
  for (let i = 0; i < bin.cells.length; i++) {
    if (bin.cells[i] === null && !cellLocked(bin, i)) {
      if (runLen === 0) runStart = i;
      runLen++;
      if (runLen >= len) return runStart;
    } else {
      runLen = 0;
    }
  }
  return -1;
}

function flash(bin, color, ms) {
  bin.flashUntil = performance.now() + ms;
  bin.flashColor = color;
}

function handleBinTap(bin) {
  if (state.over || bin.closed) return;

  // Tapping a full bin latches it shut, as long as you can still reach it.
  if (isFull(bin)) {
    if (binFullyPassed(bin)) {
      flash(bin, "#ff6b6b", 250);
      showToast("The line already pushed past that bin");
      return;
    }
    const bonus = SCORE.closeBase + SCORE.closePerCapacity * bin.capacity;
    bin.closed = true;
    state.closed += 1;
    state.score += bonus;
    flash(bin, "#ffd54f", 350);
    showToast(`Bin latched! +${bonus}`);
    return;
  }

  if (!state.current) return;

  if (binFullyPassed(bin)) {
    flash(bin, "#ff6b6b", 250);
    showToast("The line already pushed past that bin");
    return;
  }

  if (state.current.oversized) {
    state.current.revealed = true;
    flash(bin, "#ff6ba8", 300);
    showToast("Doesn't fit! It's oversized — needs a pink tag");
    return;
  }

  const start = contiguousFreeRun(bin, state.current.size);
  if (start === -1) {
    flash(bin, "#ff6b6b", 250);
    showToast("No reachable space in that bin");
    return;
  }

  for (let i = start; i < start + state.current.size; i++) {
    bin.cells[i] = state.current.color;
  }
  bin.bags.push({ start, size: state.current.size, color: state.current.color });
  state.score += SCORE.placeBase + SCORE.placePerSize * state.current.size;
  state.stowed += 1;
  flash(bin, "#4caf7d", 250);
  pullNextBag();
}

function gateCheck() {
  if (!state.current || state.over) return;
  if (state.current.oversized) {
    state.oversizedHandled += 1;
    state.score += SCORE.oversizedHandled;
    showToast("Pink-tagged and gate-checked");
  } else {
    state.score += SCORE.wrongGateCheck;
    showToast("Gate-checked a bag that would have fit");
  }
  pullNextBag();
}

function packedPercent() {
  const filled = state.cabin.bins.reduce(
    (sum, b) => sum + b.cells.filter((c) => c !== null).length, 0);
  return Math.round((filled / state.totalSections) * 100);
}

function tick(dt) {
  if (state.holdT > 0) { state.holdT -= dt; return; }
  const { cabinTop, cabinBottom } = state.cabin;
  const span = cabinBottom - cabinTop;
  const progress = (state.sweepY - cabinTop) / span;
  const speed = (span / state.spec.sweepSeconds) * (1 + 1.5 * progress);
  state.sweepY += speed * dt;
  if (state.sweepY >= cabinBottom && !state.over) endLevel();
}

// --- drawing -----------------------------------------------------------------

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCabinShell() {
  const { width, height, cabinTop, cabinBottom, aisles, seatBlocks } = state.cabin;
  const cx = width / 2;
  const fx0 = WING_PAD;          // fuselage left edge
  const fx1 = width - WING_PAD;  // fuselage right edge
  const noseBase = 56;           // where the nose cone meets the straight body
  const tailBase = height - 62;  // where the body starts tapering to the tail

  // wings — swept trapezoids reaching the canvas edge
  const wingY = cabinTop + (cabinBottom - cabinTop) * 0.38;
  ctx.strokeStyle = "#243348";
  ctx.lineWidth = 2;
  [[fx0 + 4, 2], [fx1 - 4, width - 2]].forEach(([rootX, tipX]) => {
    ctx.fillStyle = "#152232";
    ctx.beginPath();
    ctx.moveTo(rootX, wingY);
    ctx.lineTo(tipX, wingY + 52);
    ctx.lineTo(tipX, wingY + 68);
    ctx.lineTo(rootX, wingY + 44);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
  // engines hung on the wings
  ctx.fillStyle = "#22344c";
  [fx0 - 22, fx1 + 10].forEach((ex) => {
    roundRect(ctx, ex, wingY + 24, 12, 26, 5);
    ctx.fill();
    ctx.stroke();
  });

  // horizontal stabilizers at the tail
  const tpY = height - 44;
  ctx.fillStyle = "#152232";
  [[fx0 + 10, 8], [fx1 - 10, width - 8]].forEach(([rootX, tipX]) => {
    ctx.beginPath();
    ctx.moveTo(rootX, tpY);
    ctx.lineTo(tipX, tpY + 20);
    ctx.lineTo(tipX, tpY + 30);
    ctx.lineTo(rootX, tpY + 24);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // fuselage: nose cone, straight body, tail cone
  ctx.fillStyle = "#111a25";
  ctx.beginPath();
  ctx.moveTo(cx, 4);
  ctx.bezierCurveTo(fx0 + 8, 10, fx0, noseBase - 22, fx0, noseBase);
  ctx.lineTo(fx0, tailBase);
  ctx.bezierCurveTo(fx0 + 2, height - 24, cx - 12, height - 8, cx, height - 4);
  ctx.bezierCurveTo(cx + 12, height - 8, fx1 - 2, height - 24, fx1, tailBase);
  ctx.lineTo(fx1, noseBase);
  ctx.bezierCurveTo(fx1, noseBase - 22, fx1 - 8, 10, cx, 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#2b3d55";
  ctx.lineWidth = 2;
  ctx.stroke();

  // cockpit windshield
  ctx.fillStyle = "#22384f";
  ctx.beginPath();
  ctx.moveTo(cx - 24, 32);
  ctx.quadraticCurveTo(cx, 18, cx + 24, 32);
  ctx.lineTo(cx + 16, 42);
  ctx.quadraticCurveTo(cx, 32, cx - 16, 42);
  ctx.closePath();
  ctx.fill();

  // vertical fin seen from above — a spine along the tail cone
  ctx.fillStyle = "#22344c";
  roundRect(ctx, cx - 3, tailBase + 10, 6, height - tailBase - 16, 3);
  ctx.fill();

  aisles.forEach((aisle) => {
    ctx.fillStyle = "#0a1119";
    ctx.fillRect(aisle.x, cabinTop - 14, aisle.width, cabinBottom - cabinTop + 26);
    ctx.strokeStyle = "#1e2b3d";
    ctx.setLineDash([5, 9]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(aisle.x + aisle.width / 2, cabinTop - 10);
    ctx.lineTo(aisle.x + aisle.width / 2, cabinBottom + 8);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  ctx.fillStyle = "#1e2a3a";
  seatBlocks.forEach((block) => {
    for (let y = cabinTop; y < cabinBottom - 12; y += 30) {
      roundRect(ctx, block.x + 3, y, block.width - 6, 22, 4);
      ctx.fill();
    }
  });

  // cabin windows down both sides of the fuselage
  ctx.fillStyle = "#2b3d55";
  for (let y = noseBase + 8; y < tailBase - 12; y += 34) {
    roundRect(ctx, fx0 + 4, y, 5, 14, 2.5);
    ctx.fill();
    roundRect(ctx, fx1 - 9, y, 5, 14, 2.5);
    ctx.fill();
  }
}

function drawBin(bin) {
  const x = bin.column.x;
  const w = bin.column.width;
  const now = performance.now();
  const flashing = now < bin.flashUntil;
  const passed = binFullyPassed(bin);

  let fillStyle = "#1c2733";
  let strokeStyle = "#2f3f56";
  if (bin.closed) strokeStyle = "#ffd54f";
  else if (passed) { fillStyle = "#161f29"; strokeStyle = "#2a2f3a"; }
  if (flashing) { strokeStyle = bin.flashColor; fillStyle = bin.flashColor + "22"; }

  ctx.fillStyle = fillStyle;
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = bin.closed ? 3 : 2;
  roundRect(ctx, x, bin.y, w, bin.height, 9);
  ctx.fill();
  ctx.stroke();

  const cellX = x + BIN_PAD;
  const cellW = w - BIN_PAD * 2;
  bin.cells.forEach((cell, i) => {
    const cy = cellY(bin, i);
    if (cell) {
      // occupied — the suitcase itself is drawn after the slots
    } else if (cellLocked(bin, i)) {
      // unreachable empty space — wasted for the rest of the flight
      ctx.fillStyle = "#20242f";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
      ctx.strokeStyle = "#3a3040";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let hx = cellX + 4; hx < cellX + cellW; hx += 8) {
        ctx.moveTo(hx, cy + CELL_H - 2);
        ctx.lineTo(hx + CELL_H - 4, cy + 2);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2a3646";
      roundRect(ctx, cellX, cy, cellW, CELL_H, 4);
      ctx.fill();
    }
  });

  bin.bags.forEach((bag) => drawSuitcase(bin, bag, cellX, cellW));

  if (bin.closed) {
    ctx.fillStyle = "#ffd54f";
    ctx.font = "12px sans-serif";
    ctx.fillText("\u{1F512}", x + w / 2 - 6, bin.y + bin.height - 1);
  }
}

// One bag drawn as a single piece of luggage spanning its sections: a body
// with a zipper seam, straps, a handle at one end and wheels at the other.
function drawSuitcase(bin, bag, x, w) {
  const y = cellY(bin, bag.start);
  const h = bag.size * (CELL_H + CELL_GAP) - CELL_GAP;

  ctx.fillStyle = bag.color;
  roundRect(ctx, x, y, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // zipper seam along the length
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y + 6);
  ctx.lineTo(x + w / 2, y + h - 6);
  ctx.stroke();
  ctx.setLineDash([]);

  // straps across the body
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(x + 2, y + h * 0.3 - 2, w - 4, 4);
  if (bag.size > 1) ctx.fillRect(x + 2, y + h * 0.7 - 2, w - 4, 4);

  // handle at the forward end
  ctx.strokeStyle = "rgba(0,0,0,0.45)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + w / 2 - 6, y + 5);
  ctx.arcTo(x + w / 2 - 6, y + 1, x + w / 2, y + 1, 4);
  ctx.arcTo(x + w / 2 + 6, y + 1, x + w / 2 + 6, y + 5, 4);
  ctx.lineTo(x + w / 2 + 6, y + 5);
  ctx.stroke();

  // wheels at the aft end
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  [x + 6, x + w - 6].forEach((wx) => {
    ctx.beginPath();
    ctx.arc(wx, y + h - 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// Passengers seen from above: shoulders, swinging arms, a head with hair,
// and (for some) a rollaboard towed behind them up the aisle.
function drawWalkers() {
  const now = performance.now();
  const { cabinTop } = state.cabin;
  const boardedLen = Math.max(state.sweepY - cabinTop, 24);
  const walkDur = 2000 + boardedLen * 9; // constant walking speed, any cabin length
  state.walkers.forEach((w) => {
    const t = (now / walkDur + w.phase) % 1;
    const y = cabinTop + t * boardedLen;
    const stride = now / 170 + w.phase * 10;
    const cx = w.aisle.x + w.aisle.width / 2 + Math.sin(stride / 2) * 2.5;
    const sway = Math.sin(stride) * 0.12;   // shoulder rotation while walking
    const swing = Math.sin(stride) * 3.5;   // opposite-arm swing

    // towed rollaboard trails behind (up the aisle), tilted with the pull
    if (w.bag) {
      const bx = cx - Math.sin(sway * 2) * 2;
      const by = y - 16;
      ctx.strokeStyle = "rgba(160,175,195,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - 6, y - 1);
      ctx.lineTo(bx, by + 4);
      ctx.stroke();
      ctx.fillStyle = w.bag;
      roundRect(ctx, bx - 4.5, by - 6, 9, 11, 3);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // arms — small hands at the shoulder tips, swinging alternately
    ctx.fillStyle = w.skin;
    [-1, 1].forEach((side) => {
      ctx.beginPath();
      ctx.arc(cx + side * 8 * Math.cos(sway), y + side * swing * 0.8, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });

    // shoulders
    ctx.fillStyle = w.shirt;
    ctx.beginPath();
    ctx.ellipse(cx, y, 8, 4.5, sway, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // head with hair
    ctx.fillStyle = w.skin;
    ctx.beginPath();
    ctx.arc(cx, y, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = w.hair;
    ctx.beginPath();
    ctx.arc(cx, y - 0.8, 2.9, Math.PI, Math.PI * 2); // hair toward the nose
    ctx.fill();
  });
}

function drawSweep() {
  const { width, cabinBottom } = state.cabin;
  const sy = Math.min(state.sweepY, cabinBottom);
  const grad = ctx.createLinearGradient(0, sy - 26, 0, sy + 4);
  grad.addColorStop(0, "rgba(79,195,247,0)");
  grad.addColorStop(1, "rgba(79,195,247,0.28)");
  ctx.fillStyle = grad;
  ctx.fillRect(WING_PAD + 4, sy - 26, width - WING_PAD * 2 - 8, 30);
  ctx.strokeStyle = "#4fc3f7";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(WING_PAD + 6, sy);
  ctx.lineTo(width - WING_PAD - 6, sy);
  ctx.stroke();

  if (state.holdT > 0) {
    ctx.fillStyle = "#4fc3f7";
    ctx.font = "600 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`Boarding begins in ${Math.ceil(state.holdT)}… stow ahead!`, width / 2, sy + 18);
    ctx.textAlign = "left";
  }
}

function draw() {
  ctx.clearRect(0, 0, state.cabin.width, state.cabin.height);
  drawCabinShell();
  state.cabin.bins.forEach(drawBin);
  drawWalkers();
  drawSweep();
}

function updateHUD() {
  scoreEl.textContent = state.score;
  stowedEl.textContent = state.stowed;
  closedEl.textContent = state.closed;
  oversizedEl.textContent = state.oversizedHandled;
  packedEl.textContent = packedPercent() + "%";

  const { cabinTop, cabinBottom } = state.cabin;
  const pct = Math.min(100, ((state.sweepY - cabinTop) / (cabinBottom - cabinTop)) * 100);
  progressFillEl.style.width = `${pct}%`;

  if (state.current) {
    bagPreviewEl.style.height = `${state.current.size * 14 + 8}px`;
    bagPreviewEl.style.background = state.current.color;
    if (state.current.revealed) {
      bagLabelEl.textContent = "Oversized bag — won't fit anywhere";
      bagSubEl.textContent = "Tap the pink tag button to gate-check it.";
      bagSubEl.classList.add("warn");
      gateCheckBtn.classList.add("pulse");
    } else {
      const bagNames = { 1: "Personal item", 2: "Carry-on", 3: "Rollaboard" };
      bagLabelEl.textContent = `${bagNames[state.current.size] || "Bag"} — ${state.current.size} section${state.current.size > 1 ? "s" : ""}`;
      bagSubEl.textContent = "Tap bin space ahead of the boarding line.";
      bagSubEl.classList.remove("warn");
      gateCheckBtn.classList.remove("pulse");
    }
    gateCheckBtn.disabled = false;
  } else {
    bagPreviewEl.style.background = "#3a4a63";
    bagLabelEl.textContent = state.over ? "" : "No more bags";
    bagSubEl.textContent = "";
    bagSubEl.classList.remove("warn");
    gateCheckBtn.disabled = true;
    gateCheckBtn.classList.remove("pulse");
  }

  queueRowEl.innerHTML = "";
  state.queue.slice(0, 14).forEach((b) => {
    const item = document.createElement("div");
    item.className = "queueBag";
    item.style.height = `${b.size * 8 + 6}px`;
    item.style.background = b.color;
    queueRowEl.appendChild(item);
  });
}

function updateCamera() {
  const scale = canvas.clientWidth / state.cabin.width;
  const view = canvasWrapEl.clientHeight;
  const cssH = state.cabin.height * scale;
  const target = state.sweepY * scale - view * 0.42;
  canvasWrapEl.scrollTop = Math.max(0, Math.min(cssH - view, target));
}

function loop(now) {
  if (!state.over) {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    tick(Math.min(dt, 0.1));
  }
  draw();
  updateHUD();
  updateCamera();
  if (!state.over) requestAnimationFrame(loop);
}

// --- overlays & level flow ---------------------------------------------------

function clearOverlay() {
  quirkListEl.innerHTML = "";
  fleetListEl.innerHTML = "";
  overlayButtonsEl.innerHTML = "";
  overlayBodyEl.textContent = "";
}

function addButton(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.addEventListener("click", onClick);
  overlayButtonsEl.appendChild(b);
  return b;
}

function showBriefing(levelIndex) {
  const spec = FLEET[levelIndex];
  clearOverlay();
  overlayTagEl.textContent = `Level ${levelIndex + 1} · ${spec.tail}`;
  overlayTitleEl.textContent = spec.name;
  overlayBodyEl.textContent = spec.brief;
  spec.quirks.forEach((q) => {
    const li = document.createElement("li");
    li.textContent = q;
    quirkListEl.appendChild(li);
  });
  const goal = document.createElement("li");
  goal.style.borderLeftColor = "#4caf7d";
  goal.textContent = `Goal: finish with the cabin at least ${spec.targetPacked}% packed`;
  quirkListEl.appendChild(goal);

  addButton("Begin boarding", "primary", () => startLevel(levelIndex));
  if (FLEET.length > 1) addButton("Choose aircraft", "ghost", showFleetSelect);
  overlayEl.classList.remove("hidden");
}

function showFleetSelect() {
  clearOverlay();
  overlayTagEl.textContent = "Fleet";
  overlayTitleEl.textContent = "Choose an aircraft";
  overlayBodyEl.textContent = `Career score: ${careerScore}`;
  FLEET.forEach((spec, i) => {
    const btn = document.createElement("button");
    btn.className = "fleetBtn" + (i < unlocked - 1 ? " done" : "");
    btn.disabled = i >= unlocked;
    btn.innerHTML =
      `<span class="fname">${spec.name}</span>` +
      `<span class="fsub">${i >= unlocked ? "Locked" : spec.type}</span>`;
    btn.addEventListener("click", () => showBriefing(i));
    fleetListEl.appendChild(btn);
  });
  overlayEl.classList.remove("hidden");
}

function endLevel() {
  state.over = true;
  const packed = packedPercent();
  const spec = state.spec;
  const passed = packed >= spec.targetPacked;
  careerScore += state.score;
  if (passed && state.levelIndex + 1 >= unlocked) {
    unlocked = Math.min(FLEET.length, state.levelIndex + 2);
  }
  saveProgress();

  clearOverlay();
  overlayTagEl.textContent = passed ? "Doors closed" : "Delayed departure";
  overlayTitleEl.textContent = passed ? `${spec.name} dispatched` : `${spec.name} left space on the table`;
  overlayBodyEl.textContent =
    `Stowed ${state.stowed} bags, latched ${state.closed} bins and pink-tagged ` +
    `${state.oversizedHandled} oversized bags. The cabin ended ${packed}% packed ` +
    `(target ${spec.targetPacked}%). Score ${state.score} · career ${careerScore}.`;

  const hasNext = state.levelIndex + 1 < FLEET.length;
  if (passed && hasNext) {
    addButton("Next aircraft", "primary", () => showBriefing(state.levelIndex + 1));
  } else if (passed) {
    addButton("Fly it again", "primary", () => showBriefing(state.levelIndex));
  } else {
    addButton("Try again", "primary", () => showBriefing(state.levelIndex));
  }
  addButton("Choose aircraft", "ghost", showFleetSelect);
  overlayEl.classList.remove("hidden");
}

// --- input -------------------------------------------------------------------

canvas.addEventListener("click", (e) => {
  if (!state || state.over) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (state.cabin.width / rect.width);
  const y = (e.clientY - rect.top) * (state.cabin.height / rect.height);

  const hit = state.cabin.bins.find((bin) =>
    x >= bin.column.x && x <= bin.column.x + bin.column.width &&
    y >= bin.y && y <= bin.y + bin.height);
  if (hit) handleBinTap(hit);
});

gateCheckBtn.addEventListener("click", gateCheck);

loadProgress();
showBriefing(Math.min(unlocked - 1, FLEET.length - 1));
  </script>
